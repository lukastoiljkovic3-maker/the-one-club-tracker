};

async function renderWolfTab(){
  const el=document.getElementById('mainContent');
  el.innerHTML='<div class="empty"><div class="empty-icon">🐺</div><div class="empty-text">Učitavam...</div></div>';
  const data=await loadData();

  function wolfScore(s){
    const cr=s.pickups>0?s.close/s.pickups*100:0;
    const pr=s.calls>0?s.pickups/s.calls*100:0;
    return s.close*10 + s.calls*0.1 + cr*1.5 + pr*0.3;
  }

  const sN=sum(gm(data,'nikola',currentYear,currentMonth));
  const sM=sum(gm(data,'mateja',currentYear,currentMonth));
  const sD=sum(gm(data,'dusica',currentYear,currentMonth));
  const scN=wolfScore(sN), scM=wolfScore(sM), scD=wolfScore(sD);
  const maxSc=Math.max(scN,scM,scD);
  const leader = maxSc===0 ? 'tie'
    : (scN===maxSc && scM!==maxSc && scD!==maxSc) ? 'nikola'
    : (scM===maxSc && scN!==maxSc && scD!==maxSc) ? 'mateja'
    : (scD===maxSc && scN!==maxSc && scM!==maxSc) ? 'dusica'
    : 'tie';
  const leaderScore = leader==='nikola'?scN:leader==='mateja'?scM:leader==='dusica'?scD:0;
  const leaderColor = leader==='nikola'?'var(--nikola)':leader==='mateja'?'var(--mateja)':leader==='dusica'?'var(--dusica)':'var(--text)';
  const leaderName = leader==='nikola'?'Nikola':leader==='mateja'?'Mateja':leader==='dusica'?'Dusica':'Remi';

  // Build months with data
  const months=[];
  for(let m=0;m<=11;m++){
    const mn=sum(gm(data,'nikola',currentYear,m));
    const mm=sum(gm(data,'mateja',currentYear,m));
    const md=sum(gm(data,'dusica',currentYear,m));
    if(mn.calls===0&&mm.calls===0&&md.calls===0)continue;
    const sn=wolfScore(mn),sm=wolfScore(mm),sd=wolfScore(md);
    const mx=Math.max(sn,sm,sd);
    const winner = mx===0 ? 'tie'
      : (sn===mx && sm!==mx && sd!==mx) ? 'n'
      : (sm===mx && sn!==mx && sd!==mx) ? 'm'
      : (sd===mx && sn!==mx && sm!==mx) ? 'd'
      : 'tie';
    months.push({month:m,n:mn,m:mm,d:md,sn,sm,sd,winner});

  const winsM=months.filter(x=>x.winner==='m').length;
  const winsD=months.filter(x=>x.winner==='d').length;

  // Win streak
  let streakN=0,streakM=0,streakD=0;

    else if(w==='m'){if(streakN===0&&streakD===0)streakM++;else break;}
    else if(w==='d'){if(streakN===0&&streakM===0)streakD++;else break;}
    else break;

    : streakD>1?`🔥 Dusica ${streakD} meseca zaredom`
    : '';
  const maxWins=Math.max(winsN,winsM,winsD);

      <div class="wolf-hero-title" style="color:${leaderColor}">
        ${leaderName}
      </div>
      <div class="wolf-hero-sub">
        ${leader!=='tie'?`${Math.round(leaderScore)} bodova ovog meseca`:'Izjednačeno — niko se nije istakao'}
      </div>

      <div class="wolf-score-row">
        <div class="wolf-score-card ${leader==='nikola'?'wolf-leader':''}">
          ${leader==='nikola'?'<div class="wolf-crown">👑</div>':''}
          <div class="wolf-sc-av nikola"><img src="nikola.png" alt="N"/></div>

          <div class="wolf-sc-stats">
            <span>${sN.close} zat.</span>

            <span>${sN.calls} poz.</span>
          </div>
        </div>
        <div class="wolf-score-card ${leader==='mateja'?'wolf-leader':''}">
          ${leader==='mateja'?'<div class="wolf-crown">👑</div>':''}
          <div class="wolf-sc-av mateja"><img src="mateja.png" alt="M"/></div>
          <div class="wolf-sc-name">Mateja</div>
          <div class="wolf-sc-pts" style="color:var(--mateja)">${Math.round(scM)}</div>
          <div class="wolf-sc-label">bodova</div>
          <div class="wolf-sc-stats">
            <span>${sM.close} zat.</span>
            <span>${pct(sM.close,sM.pickups)}% CR</span>

async function renderCommissionSection(){
  // Load all closed leads with deals from Supabase
  const {data}=await sb.from('ghl_leads').select('assigned_to,deal').eq('status','Closed').not('deal','is',null);
  const rows=data||[];

  const calcComm=(member)=>{
    const memberDeals=rows.filter(r=>r.assigned_to===member&&r.deal&&DEAL_PRICES[r.deal]);
    const total=memberDeals.reduce((s,r)=>s+(DEAL_PRICES[r.deal]||0),0);
    const byDeal={};
    memberDeals.forEach(r=>{ byDeal[r.deal]=(byDeal[r.deal]||0)+1; });
    return{total,byDeal,count:memberDeals.length};
  };

  const cN=calcComm('nikola'), cM=calcComm('mateja'), cD=calcComm('dusica');

  const dealRows=(byDeal)=>Object.entries(byDeal).map(([key,cnt])=>{
    const d=DEALS[key];
    if(!d)return'';
    return`<div class="comm-deal-row">
      <span class="comm-deal-name">${d.icon} ${d.label} ×${cnt}</span>
      <span class="comm-deal-val">${d.price}</span>
    </div>`;
  }).join('');

  const commCell=(name,member,c,color)=>`
    <div class="comm-cell">
      <div class="comm-name">
        <div class="mc-av ${member}" style="width:30px;height:30px;flex-shrink:0">
          <img src="${member}.png" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>
        </div>
        <span style="color:${color}">${name}</span>
      </div>
      <div class="comm-amount" style="color:${color}">$${c.total.toLocaleString()}</div>
      <div class="comm-sub">${c.count} zatvorenih deala</div>
      ${c.count?`<div class="comm-deals">${dealRows(c.byDeal)}</div>`:''}
    </div>`;

  return`<div class="metrics-sec">
    <div class="metrics-sec-lbl">PROVIZIJA — Svi Zatvoreni Dealovi</div>
    <div class="comm-grid">
      ${commCell('Nikola','nikola',cN,'var(--nikola)')}
      ${commCell('Mateja','mateja',cM,'var(--mateja)')}
      ${commCell('Dusica','dusica',cD,'var(--dusica)')}
    </div>
  </div>`;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function loadLeads(lead_type){
  let q=sb.from('ghl_leads').select('*').order('date_added',{ascending:false}).limit(5000);
  if(lead_type && lead_type!=='all'){
    const tagMap={
      qualified:['qualified','qualified-webinar'],
      disqualified:['dq','disqualified-webinar'],
      webinar_lead:['webinar-lead'],
      lead_magnet:['lead-magnet'],
    };
    const tags=tagMap[lead_type]||[];
    if(tags.length) q=q.overlaps('tags',tags);
  }
  const {data,error}=await q;
  if(error){console.error(error);return[];}
  return data||[];
}

async function loadLeadCounts(){
  const [qR,dqR,wR,lR]=await Promise.all([
    sb.from('ghl_leads').select('id',{count:'exact',head:true}).overlaps('tags',['qualified','qualified-webinar']),
    sb.from('ghl_leads').select('id',{count:'exact',head:true}).overlaps('tags',['dq','disqualified-webinar']),
    sb.from('ghl_leads').select('id',{count:'exact',head:true}).overlaps('tags',['webinar-lead']),
    sb.from('ghl_leads').select('id',{count:'exact',head:true}).overlaps('tags',['lead-magnet']),
  ]);
  return{qualified:qR.count||0,disqualified:dqR.count||0,webinar_lead:wR.count||0,lead_magnet:lR.count||0};
}

function mapContact(c, lead_type){
  const cf={};
  (c.customFields||[]).forEach(f=>{if(GHL_CF[f.id])cf[GHL_CF[f.id]]=f.value;});
  return{
    id:c.id, lead_type,
    tags:c.tags||[],
    name:[c.firstName,c.lastName].filter(Boolean).join(' ')||'Nepoznat',
    email:c.email||null, phone:c.phone||null,
    instagram:cf.instagram||null, experience:cf.experience||null,
    pain_point:cf.pain_point||null, knowledge:cf.knowledge||null,
    time_frame:cf.time_frame||null, qualification:cf.qualification||null,
    date_added:c.dateAdded||new Date().toISOString(),
    synced_at:new Date().toISOString(),
    utm_source:(c.attributions||[]).find(a=>a.isFirst)?.utmSource||(c.attributions||[])[0]?.utmSource||null,
    utm_medium:(c.attributions||[]).find(a=>a.isFirst)?.utmMedium||(c.attributions||[])[0]?.utmMedium||null,
    utm_campaign:(c.attributions||[]).find(a=>a.isFirst)?.utmCampaign||(c.attributions||[])[0]?.utmCampaign||null,
    utm_content:(c.attributions||[]).find(a=>a.isFirst)?.utmContent||(c.attributions||[])[0]?.utmContent||null,
  };
}

async function syncLeadsFromGHL(){
  const btn=document.querySelector('.sync-btn');
  if(btn)btn.classList.add('spinning');
  try{
    const res=await fetch('/api/ghl-leads');
    if(!res.ok)throw new Error(`API HTTP ${res.status}`);
    const json=await res.json();
    if(json.error)throw new Error(json.error);
    // Merge all contacts by ID — tags stored from GHL, lead_type = highest priority match
    const seen=new Map();
    const priority=['qualified','disqualified','webinar_lead','lead_magnet'];
    [
      ...(json.qualified||[]).map(c=>mapContact(c,'qualified')),
      ...(json.disqualified||[]).map(c=>mapContact(c,'disqualified')),
      ...(json.webinarLead||[]).map(c=>mapContact(c,'webinar_lead')),
      ...(json.leadMagnet||[]).map(c=>mapContact(c,'lead_magnet')),
    ].forEach(r=>{
      const existing=seen.get(r.id);
      if(!existing||priority.indexOf(r.lead_type)<priority.indexOf(existing.lead_type)) seen.set(r.id,r);
    });
    const rows=[...seen.values()];
    if(rows.length){
      const {error}=await sb.from('ghl_leads').upsert(rows,{onConflict:'id',ignoreDuplicates:false});
      if(error)console.error('Upsert error:',error);
    }
    await renderLeadsSection();
  }catch(e){
    console.error('GHL sync error:',e);
    const msg='Ne mogu da sinhronizujem sa GHL: '+e.message;
    document.getElementById('mainContent').insertAdjacentHTML('afterbegin',
      `<div style="background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);border-radius:10px;padding:12px 16px;color:var(--red);font-size:12px;font-weight:600;margin-bottom:12px;">${msg}</div>`);
  }
  if(btn)btn.classList.remove('spinning');
}

async function loadCampaignData(){
  const {data,error}=await sb.from('ghl_leads')
    .select('utm_campaign,utm_content,utm_source,utm_medium,status,deal,lead_type,tags')
    .overlaps('tags',['webinar-lead','qualified-webinar','disqualified-webinar'])
    .limit(5000);
  if(error||!data) return [];
  const isId=v=>v&&/^\d{10,}$/.test(v.trim());
  const fmt=v=>!v||isId(v)?null:v;
  const fmtCampaign=v=>!v||isId(v)?'Nepoznata kampanja':v.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  const map={};
  data.forEach(r=>{
    const content=fmt(r.utm_content);
    const hasUtm=!!(r.utm_campaign||r.utm_content||r.utm_source);
    const key=hasUtm?(content||'').toLowerCase()||'no-content':'organic';
    if(!map[key]) map[key]={
      content:hasUtm?(content||'Nepoznat oglas'):'Organic / Direct',
      campaign:hasUtm?fmtCampaign(r.utm_campaign):'',
      source:(r.utm_source||'').toLowerCase().replace(/^ig$/,'instagram'),
      leads:0, closes:0
    };
    map[key].leads++;
    if(r.status==='Closed') map[key].closes++;
  });
  return Object.values(map).sort((a,b)=>b.leads-a.leads);
}

function toggleNote(id){
  const area=document.getElementById('note-'+id);
  if(!area)return;
  const opening=!area.classList.contains('open');
  if(opening){openNotes.add(id);area.classList.add('open');setTimeout(()=>area.querySelector('textarea').focus(),30);}
  else{openNotes.delete(id);area.classList.remove('open');}
}

async function saveLeadNote(id,notes){
  const lead=cachedLeads.find(l=>l.id===id);
  if(!lead)return;
  const val=notes.trim();
  if(lead.notes===val||(lead.notes==null&&val===''))return;
  lead.notes=val||null;
  await sb.from('ghl_leads').update({notes:val||null}).eq('id',id);
  const btn=document.getElementById('nb-'+id);
  const span=document.getElementById('nbt-'+id);
  if(btn)btn.classList.toggle('has-note',Boolean(val));
  if(span)span.textContent=val?(val.length>50?val.substring(0,50)+'…':val):'Dodaj belešku';
}

async function updateLeadFollowUp(id,date){
  const lead=cachedLeads.find(l=>l.id===id);
  if(!lead)return;
  lead.follow_up_date=date||null;
  await sb.from('ghl_leads').update({follow_up_date:date||null}).eq('id',id);
}

function updateLeadFollowUpPanel(id,date,input){
  updateLeadFollowUp(id,date);
  const btn=input.closest('.ldp-fu-btn');
  if(!btn)return;
  const txt=btn.querySelector('.ldp-fu-text');
  if(!txt)return;
  if(date){
    const d=new Date(date+'T00:00');
    txt.textContent=d.toLocaleDateString('sr-RS',{day:'numeric',month:'long',year:'numeric'});
    txt.className='ldp-fu-text has-date';
  } else {
    txt.textContent='Postavi datum';
    txt.className='ldp-fu-text';
  }
}

async function assignLead(id,member){
  const lead=cachedLeads.find(l=>l.id===id);
  if(!lead)return;
  const newVal=lead.assigned_to===member?null:member;
  const {error}=await sb.from('ghl_leads').update({assigned_to:newVal}).eq('id',id);
  if(!error){lead.assigned_to=newVal;renderLeads(cachedLeads);}
}

async function updateLeadStatus(id,status){
  const {error}=await sb.from('ghl_leads').update({status}).eq('id',id);
  if(!error){
    const lead=cachedLeads.find(l=>l.id===id);
    if(lead){
      lead.status=status;
      renderLeads(cachedLeads);
      if(currentLeadId===id)openLeadDetail(id);
    }
  }
}

async function updateLeadDeal(id,deal){
  const {error}=await sb.from('ghl_leads').update({deal:deal||null}).eq('id',id);
  if(!error){
    const lead=cachedLeads.find(l=>l.id===id);
    if(lead){lead.deal=deal||null;renderLeads(cachedLeads);}
  }
}

/* ── GOOGLE SHEETS REVENUE ── */
const SHEET_ID='1oDEq47UJtmHIaXUDtwFWOeU5huWIz69PsnjC4YcC0O8';

async function fetchSheetData(){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
  const res=await fetch(url);
  const text=await res.text();
  const start=text.indexOf('(');
  const json=JSON.parse(text.substring(start+1,text.lastIndexOf(')')));
  return (json.table.rows||[]).map(r=>({
    name:(r.c[0]?.v||'').toString().trim().replace(/^~/,''),
    challenge:r.c[1]?.v||0,
    email:(r.c[2]?.v||'').toString().trim(),
    date:r.c[3]?.v||null,
    closer:(r.c[4]?.v||'').toString().trim(),
    status:(r.c[5]?.v||'').toString().trim()
  })).filter(r=>r.name);
}

function parseGvizDate(d){
  if(!d)return '';
  const m=String(d).match(/Date\((\d+),(\d+),(\d+)\)/);
  if(!m)return String(d);
  return new Date(+m[1],+m[2],+m[3]).toLocaleDateString('sr-RS',{day:'numeric',month:'short',year:'numeric'});
}

async function loadRevenue(){
  const sec=document.getElementById('revenue-section');
  if(!sec)return;
  try{
    const rows=await fetchSheetData();
    renderRevenue(rows,sec);
  }catch(e){
    sec.innerHTML=`<div class="card"><div class="card-body" style="color:var(--red);font-size:12px;font-weight:600">Greška pri učitavanju: ${e.message}</div></div>`;
  }
}

function renderRevenue(rows,sec){
  const polozeno=rows.filter(r=>r.status==='polozeno');
  const uToku=rows.filter(r=>r.status==='u toku');
  const rezervacija=rows.filter(r=>r.status==='rezervacija');
  const cash=polozeno.reduce((s,r)=>s+r.challenge,0);
  const pipeline=uToku.reduce((s,r)=>s+r.challenge,0);
  const total=rows.reduce((s,r)=>s+r.challenge,0);

  const stMap={
    polozeno:  {label:'Položeno',   cls:'pill-g'},
    'u toku':  {label:'U Toku',     cls:'pill-y'},
    rezervacija:{label:'Rezervacija',cls:'pill-b'},
    '':        {label:'—',          cls:''}
  };

  const tableRows=rows.map(r=>{
    const st=stMap[r.status]||{label:r.status,cls:''};
    return `<tr>
      <td style="font-weight:700">${esc(r.name)}</td>
      <td style="font-weight:800;color:var(--green)">$${r.challenge.toLocaleString()}</td>
      <td style="color:var(--muted)">${parseGvizDate(r.date)}</td>
      <td style="color:var(--muted)">${esc(r.closer)}</td>
      <td><span class="rev-pill ${st.cls}">${st.label}</span></td>
    </tr>`;
  }).join('');

  sec.innerHTML=`
    <div class="card">
      <div class="card-head">
        <div class="card-title">💰 Prihodi & Klijenti</div>
        <div class="card-hint">${rows.length} klijenata · Live</div>
      </div>
      <div class="card-body">
        <div class="rev-kpis">
          <div class="rev-kpi" style="border-bottom:2px solid var(--green)">
            <div class="rev-kpi-lbl">Cash Collected</div>
            <div class="rev-kpi-val" style="color:var(--green)">$${cash.toLocaleString()}</div>
            <div class="rev-kpi-sub">${polozeno.length} položenih</div>
          </div>
          <div class="rev-kpi" style="border-bottom:2px solid var(--yellow)">
            <div class="rev-kpi-lbl">Pipeline</div>
            <div class="rev-kpi-val" style="color:var(--yellow)">$${pipeline.toLocaleString()}</div>
            <div class="rev-kpi-sub">${uToku.length} u toku</div>
          </div>
          <div class="rev-kpi" style="border-bottom:2px solid var(--accent)">
            <div class="rev-kpi-lbl">Rezervacije</div>
            <div class="rev-kpi-val" style="color:var(--accent)">${rezervacija.length}</div>
            <div class="rev-kpi-sub">$${rezervacija.reduce((s,r)=>s+r.challenge,0).toLocaleString()}</div>
          </div>
          <div class="rev-kpi" style="border-bottom:2px solid var(--muted2)">
            <div class="rev-kpi-lbl">Total Revenue</div>
            <div class="rev-kpi-val">$${total.toLocaleString()}</div>
            <div class="rev-kpi-sub">${rows.length} ukupno</div>
          </div>
        </div>
        <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
          <table class="rev-table">
            <thead><tr><th>Klijent</th><th>Iznos</th><th>Datum</th><th>Closer</th><th>Status</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
}

/* ── CHART ── */
let chartInst=null;
function initChart(data) {
  const canvas=document.getElementById('barChart');
  if (!canvas) return;
  if (chartInst){chartInst.destroy();chartInst=null;}
  const days=new Date(currentYear,currentMonth+1,0).getDate();
  const labels=Array.from({length:days},(_,i)=>i+1);
  let datasets;
  if (currentTab==='team'){
    const dmN=gm(data,'nikola',currentYear,currentMonth);
    const dmM=gm(data,'mateja',currentYear,currentMonth);
    const dmD=gm(data,'dusica',currentYear,currentMonth);
    datasets=[
      {label:'Nikola',data:labels.map(d=>dmN[d]?.calls||0),backgroundColor:'rgba(59,130,246,.75)',borderRadius:4,stack:'s'},
      {label:'Mateja',data:labels.map(d=>dmM[d]?.calls||0),backgroundColor:'rgba(168,85,247,.75)',borderRadius:4,stack:'s'},
      {label:'Dusica',data:labels.map(d=>dmD[d]?.calls||0),backgroundColor:'rgba(249,115,22,.75)',borderRadius:4,stack:'s'}
    ];
  } else {
    const dm=gm(data,currentTab,currentYear,currentMonth);
    const rgb=currentTab==='nikola'?'59,130,246':currentTab==='dusica'?'249,115,22':'168,85,247';
    datasets=[
      {label:'Pozivi',data:labels.map(d=>dm[d]?.calls||0),backgroundColor:`rgba(${rgb},.7)`,borderRadius:4},
      {label:'Javljanja',data:labels.map(d=>dm[d]?.pickups||0),backgroundColor:`rgba(${rgb},.3)`,borderRadius:4},
      {label:'Zatvoreni',data:labels.map(d=>dm[d]?.close||0),backgroundColor:'rgba(34,197,94,.75)',borderRadius:4}
    ];
  }
  chartInst=new Chart(canvas,{
    type:'bar',data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#71717a',font:{size:11,family:'Inter'},boxWidth:10,boxHeight:10}}},
      scales:{
        x:{ticks:{color:'#52525b',font:{size:10}},grid:{color:'rgba(255,255,255,0.03)'}},
        y:{ticks:{color:'#52525b',font:{size:10}},grid:{color:'rgba(255,255,255,0.04)'},beginAtZero:true}
      }
    }
  });
}

/* ── MODAL ── */
let editDay=null,editMember=null;
function openModal(day,member){
  editDay=day;editMember=member||(currentTab!=='team'?currentTab:'nikola');
  document.getElementById('fMember').value=editMember;
  document.getElementById('fDay').value=day||'';
  document.getElementById('modalTitle').textContent=day?`Izmeni Dan ${day}`:'Unesi Dan';
  document.getElementById('modalSub').textContent=day?`${MONTHS[currentMonth]} ${currentYear}`:'Popunite podatke za izabrani dan';
  document.getElementById('deleteBtn').style.display=day?'flex':'none';
  if(day&&editMember){
    loadData().then(data=>{
      const d=gm(data,editMember,currentYear,currentMonth)[day]||{};
      document.getElementById('fCalls').value=d.calls||'';
      document.getElementById('fPickups').value=d.pickups||'';
      document.getElementById('fDq').value=d.dq||'';
      document.getElementById('fFollowup').value=d.followup||'';
      document.getElementById('fClose').value=d.close||'';
    });
  } else {
    ['fCalls','fPickups','fDq','fFollowup','fClose'].forEach(id=>document.getElementById(id).value='');
  }
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('fCalls').focus(),60);
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');editDay=null;editMember=null;}

async function saveEntry(){
  const member=document.getElementById('fMember').value;
  const day=parseInt(document.getElementById('fDay').value);
  if(!day||day<1||day>31){alert('Unesite validan dan (1–31)');return;}
  const btn=document.getElementById('saveBtn');
  btn.textContent='Čuvam…';btn.disabled=true;
  const {error}=await sb.from('daily_entries').upsert({
    member,year:currentYear,month:currentMonth,day,
    calls:parseInt(document.getElementById('fCalls').value)||0,
    pickups:parseInt(document.getElementById('fPickups').value)||0,
    dq:parseInt(document.getElementById('fDq').value)||0,
    followup:parseInt(document.getElementById('fFollowup').value)||0,
    close:parseInt(document.getElementById('fClose').value)||0,
    updated_at:new Date().toISOString()
  },{onConflict:'member,year,month,day'});
  btn.textContent='Sačuvaj';btn.disabled=false;
  if(error){alert('Greška: '+error.message);return;}
  closeModal();render();
}
async function deleteEntry(){
  if(!editDay||!editMember)return;
  const {error}=await sb.from('daily_entries').delete()
    .eq('member',editMember).eq('year',currentYear)
    .eq('month',currentMonth).eq('day',editDay);
  if(error){alert('Greška: '+error.message);return;}
  closeModal();render();
}

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&document.getElementById('modalOverlay').classList.contains('open'))saveEntry();
});
</script>
