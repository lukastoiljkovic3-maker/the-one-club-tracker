async function bulkAssign(member){
  const ids = [...selectedLeadIds];
  if (!ids.length) return;
  const { error } = await sb.from('ghl_leads').update({ assigned_to: member }).in('id', ids);
  if (error) { alert('Greška: '+error.message); return; }
  // Log each
  ids.forEach(id => {
    const lead = cachedLeads.find(l=>l.id===id);
    if (lead) {
      logActivity(id, 'assign', lead.assigned_to||null, member);
      lead.assigned_to = member;
    }
  });
  refreshLeadRows();
}

async function bulkStatus(status){
  const ids = [...selectedLeadIds];
  if (!ids.length) return;
  const { error } = await sb.from('ghl_leads').update({ status }).in('id', ids);
  if (error) { alert('Greška: '+error.message); return; }
  ids.forEach(id => {
    const lead = cachedLeads.find(l=>l.id===id);
    if (lead) {
      logActivity(id, 'status', lead.status||'Novi', status);
      lead.status = status;
    }
  });
  refreshLeadRows();
}

async function bulkFollowUp(date){
  const ids = [...selectedLeadIds];
  if (!ids.length) return;
  const val = date || null;
  const { error } = await sb.from('ghl_leads').update({ follow_up_date: val }).in('id', ids);
  if (error) { alert('Greška: '+error.message); return; }
  ids.forEach(id => {
    const lead = cachedLeads.find(l=>l.id===id);
    if (lead) {
      logActivity(id, 'followup', lead.follow_up_date||null, val);
      lead.follow_up_date = val;
    }
  });
  refreshLeadRows();
}

// Updates ONLY the table body + filter-bar counts (preserves search focus).
function refreshLeadRows(){
  const {leads,fc}=computeLeads();
  const body=document.getElementById('leadsBody');
  if(body) body.innerHTML=buildLeadRows(leads);
  const bar=document.getElementById('leadsFilterBar');
  if(bar){
    bar.querySelectorAll('.filter-btn').forEach(b=>{
      const f=b.dataset.filter;
      b.classList.toggle('active',f===leadsFilter);
      if(f==='all') b.textContent=`Svi (${fc.all})`;
    });
  }
}

function renderLeadCard(lead, subTab){
  const todayStr=new Date().toISOString().slice(0,10);
  const assigned=lead.assigned_to;
  const st=lead.status||'Novi';
  const asCls=assigned?'assigned-'+assigned:'';
  const stCls='status-'+st.replace(/\s+/g,'-');
  // Type-specific accent override when not assigned
  const typeAccent = !assigned
    ? (subTab==='dq'?'style="--lc:var(--red)"':subTab==='lead_magnet'?'style="--lc:var(--yellow)"':'')
    : '';
  const noteOpen=openNotes.has(lead.id);
  const notePrev=lead.notes?(lead.notes.length>52?lead.notes.substring(0,52)+'…':lead.notes):null;
  const dateStr=lead.date_added?new Date(lead.date_added).toLocaleDateString('sr-RS',{day:'numeric',month:'short',year:'numeric'}):'';

  // Avatar initials
  const words=(lead.name||'?').trim().split(/\s+/);
  const initials=(words[0]?.[0]||'')+(words[1]?.[0]||'');
  const avCls=assigned==='mateja'?'av-m':assigned==='dusica'?'av-d':'';

  // Status pill
  const stPillCls={'Novi':'s-novi','Follow Up':'s-followup','Closed':'s-closed','DQ':'s-dq'}[st]||'s-novi';

  // Fields
  const fields=[
    lead.pain_point ?{l:'Problem',        v:lead.pain_point, full:true}:null,
    lead.experience ?{l:'Iskustvo',        v:lead.experience}:null,
    lead.time_frame ?{l:'Vremenski okvir', v:lead.time_frame}:null,
    lead.knowledge  ?{l:'Znanje',          v:lead.knowledge}:null,

async function assignLead(id,member){

}

async function updateLeadStatus(id,status){
  const lead=cachedLeads.find(l=>l.id===id);
  const oldStatus=lead?(lead.status||'Novi'):null;
  const {error}=await sb.from('ghl_leads').update({status}).eq('id',id);
  if(!error){
    if(lead){
      lead.status=status;
      renderLeads(cachedLeads);
      if(currentLeadId===id)openLeadDetail(id);
    }
    logActivity(id,'status',oldStatus,status);
    // Two-way sync: push corresponding tag to GHL
    pushStatusToGHL(id, oldStatus, status);
  }
}

// Map tracker status to GHL tags. Each status maps to a single tag;
// switching status removes the old tag and adds the new one.
const STATUS_TAG_MAP = {
  'Novi':      'tracker-novi',
  'Follow Up': 'tracker-followup',
  'Closed':    'tracker-closed',
  'DQ':        'tracker-dq',
};
async function pushStatusToGHL(contactId, oldStatus, newStatus){
  if (!contactId || oldStatus === newStatus) return;
  const removeTag = STATUS_TAG_MAP[oldStatus];
  const addTag    = STATUS_TAG_MAP[newStatus];
  const payload = { contactId };
  if (addTag)    payload.addTags    = [addTag];
  if (removeTag && removeTag !== addTag) payload.removeTags = [removeTag];
  if (!payload.addTags && !payload.removeTags) return;
  try {
    await fetch('/api/ghl-update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  } catch (e) { /* non-fatal */ }
}

async function updateLeadDeal(id,deal){
  const lead=cachedLeads.find(l=>l.id===id);
  const oldDeal=lead?(lead.deal||null):null;
  const {error}=await sb.from('ghl_leads').update({deal:deal||null}).eq('id',id);
  if(!error){
    if(lead){lead.deal=deal||null;renderLeads(cachedLeads);
    logActivity(id,'deal',oldDeal,deal||null);}
  }
}

/* ─────────────────── SHEET → CRM CLOSED SYNC ──────────────────────
 * Reads the Google Sheet (source of truth for closed deals) and
 * marks each matching ghl_leads row as status='Closed'. Match by
 * email first, then by exact (case-insensitive) name fallback.
 * Bonus: if the sheet row has a closer, assign the lead to that
 * rep if it's still unassigned. Runs silently every time the
 * Metrics tab or revenue section is loaded.
 * ─────────────────────────────────────────────────────────────── */
const CLOSER_TO_MEMBER = {
  'mateja': 'mateja',
  'dusica': 'dusica',
  'dušica': 'dusica',
};
function _normLow(s){ return (s||'').toString().trim().toLowerCase(); }
function _normName(s){
  return _normLow(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
}
function _challengeToDeal(amount){
  const m = { 10000:'funded_10k', 25000:'funded_25k', 50000:'funded_50k',
              100000:'funded_100k', 200000:'funded_200k', 400000:'funded_400k' };
  return m[Number(amount)] || null;
}

let _sheetSyncRunning = false;
let _sheetSyncLastRun = 0;

async function syncClosedFromSheet(opts = {}){
  // Throttle: don't run more than once every 30s unless forced
  if (_sheetSyncRunning) return null;
  if (!opts.force && Date.now() - _sheetSyncLastRun < 30000) return null;
  _sheetSyncRunning = true;
  try {
    let sheet;
    try { sheet = await fetchSheetData(); }
    catch (e) { return { error: 'Ne mogu da učitam Sheet: '+e.message }; }
    if (!sheet || !sheet.length) return { matched: 0, updated: 0 };

    const emails = [...new Set(sheet.map(r => _normLow(r.email)).filter(Boolean))];
    const names  = [...new Set(sheet.map(r => r.name).filter(Boolean))];

    // Fetch potential matches by email + by exact name
    const fetched = [];
    if (emails.length) {
      const { data } = await sb.from('ghl_leads')
        .select('id,name,email,status,deal,assigned_to')
        .in('email', emails);
      if (data) fetched.push(...data);
    }
    if (names.length) {
      const { data } = await sb.from('ghl_leads')
        .select('id,name,email,status,deal,assigned_to')
        .in('name', names);
      if (data) fetched.push(...data);
    }
    // Dedupe by id
    const byId = new Map();
    fetched.forEach(c => byId.set(c.id, c));
    const candidates = [...byId.values()];

    // Build lookup indexes
    const byEmail = new Map();
    const byName  = new Map();
    candidates.forEach(c => {
      if (c.email) byEmail.set(_normLow(c.email), c);
      if (c.name)  byName.set(_normName(c.name), c);
    });

    const updates = [];
    let matchCount = 0;
    for (const row of sheet) {
      const e = _normLow(row.email);
      const n = _normName(row.name);
      const match = (e && byEmail.get(e)) || (n && byName.get(n));
      if (!match) continue;
      matchCount++;
      const patch = {};
      if (match.status !== 'Closed') patch.status = 'Closed';
      const dealKey = _challengeToDeal(row.challenge);
      if (dealKey && !match.deal) patch.deal = dealKey;
      const closer = CLOSER_TO_MEMBER[_normLow(row.closer)];
      if (closer && !match.assigned_to) patch.assigned_to = closer;
      if (!Object.keys(patch).length) continue;
      updates.push({
        id: match.id, patch,
        oldStatus: match.status || 'Novi',
        oldDeal:   match.deal || null,
        oldAssign: match.assigned_to || null,
      });
    }

    if (!updates.length) return { matched: matchCount, updated: 0 };

    // Apply updates + activity log entries
    for (const u of updates) {
      const { error } = await sb.from('ghl_leads').update(u.patch).eq('id', u.id);
      if (error) { console.error('Sheet→CRM update error:', error); continue; }
      if (u.patch.status && u.patch.status !== u.oldStatus) {
        logActivity(u.id, 'status', u.oldStatus, u.patch.status);
      }
      if (u.patch.deal && u.patch.deal !== u.oldDeal) {
        logActivity(u.id, 'deal', u.oldDeal, u.patch.deal);
      }
      if (u.patch.assigned_to && u.patch.assigned_to !== u.oldAssign) {
        logActivity(u.id, 'assign', u.oldAssign, u.patch.assigned_to);
      }
      // Refresh cached lead if loaded
      const cached = (cachedLeads||[]).find(l => l.id === u.id);
      if (cached) Object.assign(cached, u.patch);
    }
    return { matched: matchCount, updated: updates.length };
  } finally {
    _sheetSyncRunning = false;
    _sheetSyncLastRun = Date.now();
  }
}

/* ─────────────────── AUTO ROUND-ROBIN ASSIGNMENT ──────────────────
 * Fairly distributes unassigned tracker-relevant leads between
 * Mateja and Dušica. Whoever has fewer open leads (status not in
 * Closed/DQ) gets the next one. Activity log records each.
 * ─────────────────────────────────────────────────────────────── */
async function autoAssignUnassigned(){
  // Get current workload counts (open leads per rep)
  const [mR, dR] = await Promise.all([
    sb.from('ghl_leads').select('id',{count:'exact',head:true})
      .eq('assigned_to','mateja').neq('status','Closed').neq('status','DQ'),
    sb.from('ghl_leads').select('id',{count:'exact',head:true})
      .eq('assigned_to','dusica').neq('status','Closed').neq('status','DQ'),
  ]);
  let mateja = mR.count || 0;
  let dusica = dR.count || 0;

  // Fetch unassigned, open, tracker-relevant leads
  const { data, error } = await sb.from('ghl_leads')
    .select('id,date_added,tags,status')
    .is('assigned_to', null)
    .neq('status','Closed').neq('status','DQ')
    .overlaps('tags', ['qualified','qualified-webinar','webinar-lead','prisustvovao-webinaru'])
    .order('date_added', { ascending: true })
    .limit(500);
  if (error || !data || !data.length) return { assigned: 0 };

  let assignedM = 0, assignedD = 0;
  for (const lead of data) {
    const target = mateja <= dusica ? 'mateja' : 'dusica';
    const { error: upErr } = await sb.from('ghl_leads').update({ assigned_to: target }).eq('id', lead.id);
    if (upErr) continue;
    logActivity(lead.id, 'assign', null, target);
    if (target === 'mateja') { mateja++; assignedM++; } else { dusica++; assignedD++; }
    const cached = (cachedLeads||[]).find(l => l.id === lead.id);
    if (cached) cached.assigned_to = target;
  }
  return { assigned: assignedM + assignedD, mateja: assignedM, dusica: assignedD };
}

async function fetchSheetData(){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
  const res=await fetch(url);
  const text=await res.text();
  const start=text.indexOf('(');
  const json=JSON.parse(text.substring(start+1,text.lastIndexOf(')')));
  return (json.table.rows||[]).map(r=>({
    name:(r.c[0]?.v||'').toString().trim().replace(/^~/,''),
    challenge:r.c[1]?.v||0,
    email:(r.c[2]?.v||'').toString().trim(),
    date:r.c[3]?.v||null,
    closer:(r.c[4]?.v||'').toString().trim(),
    status:(r.c[5]?.v||'').toString().trim()
  })).filter(r=>r.name);
}

function parseGvizDate(d){
  if(!d)return '';
  const m=String(d).match(/Date\((\d+),(\d+),(\d+)\)/);
  if(!m)return String(d);
  return new Date(+m[1],+m[2],+m[3]).toLocaleDateString('sr-RS',{day:'numeric',month:'short',year:'numeric'});
}

let chartInst=null;
function initChart(data) {
  const canvas=document.getElementById('barChart');
  if (!canvas) return;
  if (chartInst){chartInst.destroy();chartInst=null;}
  const days=new Date(currentYear,currentMonth+1,0).getDate();
  const labels=Array.from({length:days},(_,i)=>i+1);
  let datasets;
  if (currentTab==='team'){
    const dmM=gm(data,'mateja',currentYear,currentMonth);
    const dmD=gm(data,'dusica',currentYear,currentMonth);
    datasets=[
      {label:'Mateja',data:labels.map(d=>dmM[d]?.calls||0),backgroundColor:'rgba(168,85,247,.75)',borderRadius:4,stack:'s'},
      {label:'Dusica',data:labels.map(d=>dmD[d]?.calls||0),backgroundColor:'rgba(249,115,22,.75)',borderRadius:4,stack:'s'}
    ];
  } else {
    const dm=gm(data,currentTab,currentYear,currentMonth);
    const rgb=currentTab==='dusica'?'249,115,22':'168,85,247';
    datasets=[
      {label:'Pozivi',data:labels.map(d=>dm[d]?.calls||0),backgroundColor:`rgba(${rgb},.7)`,borderRadius:4},
      {label:'Javljanja',data:labels.map(d=>dm[d]?.pickups||0),backgroundColor:`rgba(${rgb},.3)`,borderRadius:4},
      {label:'Zatvoreni',data:labels.map(d=>dm[d]?.close||0),backgroundColor:'rgba(34,197,94,.75)',borderRadius:4}
    ];
  }
  chartInst=new Chart(canvas,{
    type:'bar',data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#71717a',font:{size:11,family:'Inter'},boxWidth:10,boxHeight:10}}},
      scales:{
        x:{ticks:{color:'#52525b',font:{size:10}},grid:{color:'rgba(255,255,255,0.03)'}},
        y:{ticks:{color:'#52525b',font:{size:10}},grid:{color:'rgba(255,255,255,0.04)'},beginAtZero:true}
      }
    }
  });
}

/* ── MODAL ── */
let editDay=null,editMember=null;
function openModal(day,member){
  editDay=day;editMember=member||(currentTab!=='team'?currentTab:'mateja');
  document.getElementById('fMember').value=editMember;
  document.getElementById('fDay').value=day||'';
  document.getElementById('modalTitle').textContent=day?`Izmeni Dan ${day}`:'Unesi Dan';
  document.getElementById('modalSub').textContent=day?`${MONTHS[currentMonth]} ${currentYear}`:'Popunite podatke za izabrani dan';
  document.getElementById('deleteBtn').style.display=day?'flex':'none';
  if(day&&editMember){
    loadData().then(data=>{
      const d=gm(data,editMember,currentYear,currentMonth)[day]||{};
      document.getElementById('fCalls').value=d.calls||'';
      document.getElementById('fPickups').value=d.pickups||'';
      document.getElementById('fDq').value=d.dq||'';
      document.getElementById('fFollowup').value=d.followup||'';
      document.getElementById('fClose').value=d.close||'';
    });
  } else {
    ['fCalls','fPickups','fDq','fFollowup','fClose'].forEach(id=>document.getElementById(id).value='');
  }
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('fCalls').focus(),60);
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');editDay=null;editMember=null;}

async function saveEntry(){
  const member=document.getElementById('fMember').value;
  const day=parseInt(document.getElementById('fDay').value);
  if(!day||day<1||day>31){alert('Unesite validan dan (1–31)');return;}
  const btn=document.getElementById('saveBtn');
  btn.textContent='Čuvam…';btn.disabled=true;
  const {error}=await sb.from('daily_entries').upsert({
    member,year:currentYear,month:currentMonth,day,
    calls:parseInt(document.getElementById('fCalls').value)||0,
    pickups:parseInt(document.getElementById('fPickups').value)||0,
    dq:parseInt(document.getElementById('fDq').value)||0,
    followup:parseInt(document.getElementById('fFollowup').value)||0,
    close:parseInt(document.getElementById('fClose').value)||0,
    updated_at:new Date().toISOString()
  },{onConflict:'member,year,month,day'});
  btn.textContent='Sačuvaj';btn.disabled=false;
  if(error){alert('Greška: '+error.message);return;}
  closeModal();render();
}
async function deleteEntry(){
  if(!editDay||!editMember)return;
  const {error}=await sb.from('daily_entries').delete()
    .eq('member',editMember).eq('year',currentYear)
    .eq('month',currentMonth).eq('day',editDay);
  if(error){alert('Greška: '+error.message);return;}
  closeModal();render();
}

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&document.getElementById('modalOverlay').classList.contains('open'))saveEntry();
});
</script>
