    padding-top: calc(10px + env(safe-area-inset-top));
    padding-bottom: 10px; padding-left: 16px; padding-right: 16px;
  }

  /* Logo */
  .logo-img img { width: 28px; height: 28px; }
  .logo-name { font-size: 11px; letter-spacing: 2px; }
  .logo-sub { display: none; }

  /* Month nav */
  .month-label { font-size: 12px; min-width: 90px; }
  .month-nav { padding: 0 4px; }
  .month-nav button { width: 30px; height: 30px; font-size: 13px; }

  /* Main */
  main {
    padding-top: 14px; padding-left: 12px; padding-right: 12px;
    padding-bottom: calc(90px + env(safe-area-inset-bottom)); gap: 10px;
  }

  /* Toolbar */
  .toolbar { flex-direction: column; align-items: stretch; gap: 8px; }
  .btn-add { display: none; }

  /* Tabs */
  .tabs { width:100%; display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch; flex-wrap:nowrap; padding:3px; gap:2px; }
  .tab { flex-shrink:0; justify-content:center; padding:8px 14px; font-size:12px; }

  /* KPI — 3 cols, compact strip */
  .kpi-grid { grid-template-columns: repeat(3,1fr); gap: 1px; }
  .kpi { padding: 14px 10px 10px; }
  .kpi-label { font-size: 7px; letter-spacing: 1px; margin-bottom: 6px; }
  .kpi-val { font-size: 26px; letter-spacing: -1.5px; }
  .kpi-sub { font-size: 9px; margin-top: 3px; }
  .kpi::before { height: 2px; }

  /* Content — flex column with reorder support */
  .content-grid { display: flex !important; flex-direction: column; gap: 10px; }
  .content-grid [data-role="side"] { order: 1; }
  .content-grid [data-role="main"] { order: 2; }
  .content-grid [data-role="revenue"] { order: 3; }

  .side-panel { display: flex; flex-direction: column; gap: 10px; }
  .mc { min-width: unset; }
  .mt { margin-top: 6px; }

  /* Cards */
  .card-head { padding: 12px 14px; }
  .card-body { padding: 14px; }
  .card-title { font-size: 10px; letter-spacing: .8px; }
  .card-hint { font-size: 10px; }

  /* Calendar — touch-friendly dots */
  .cal-grid { display: grid !important; grid-template-columns: repeat(7,1fr) !important; gap: 3px; padding: 8px; width: 100%; }
  .cal-cell {
    min-height: 44px; border-radius: 9px; gap: 3px;
    justify-content: center; min-width: 0; aspect-ratio: unset;
  }
  .cal-day-head { font-size: 9px; letter-spacing: .3px; padding-bottom: 6px; }
  .cal-num { font-size: 13px; font-weight: 800; }
  .cal-calls, .cal-close { display: none; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

  /* Log — card list on mobile */
  .log-table { display: none; }
  .log-list { display: block; }
  .log-entry {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px; border-bottom: 1px solid var(--b);
    cursor: pointer; transition: background .1s; touch-action: manipulation;
  }
  .log-entry:active { background: var(--s2); }
  .log-entry:last-child { border-bottom: none; }
  .log-entry-day {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--s2); border: 1px solid var(--b);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: var(--muted); flex-shrink: 0;
  }
  .log-entry-body { flex: 1; min-width: 0; }
  .log-entry-stats { display: flex; gap: 12px; align-items: center; margin-bottom: 5px; }
  .log-stat { font-size: 13px; font-weight: 700; }
  .log-stat em { font-style: normal; font-size: 9px; font-weight: 500; color: var(--muted); margin-left: 1px; }
  .log-entry-bar { height: 2px; background: var(--s3); border-radius: 99px; overflow: hidden; }
  .log-entry-bar-fill { height: 100%; border-radius: 99px; }
  .log-entry-arrow { font-size: 18px; color: var(--muted2); flex-shrink: 0; line-height: 1; }

  /* Member cards */
  .mc { padding: 14px 14px; }
  .mc-head { margin-bottom: 14px; }
  .mc-stats { gap: 5px; }
  .mc-stat { padding: 10px 10px; }
  .mc-stat-val { font-size: 24px; letter-spacing: -1px; }
  .mc-stat-lbl { font-size: 8px; }
  .mc-name { font-size: 15px; }
  .mc-av { width: 40px; height: 40px; font-size: 14px; }
  .mc-role { font-size: 8px; }

  /* Progress */
  .prog { margin-top: 8px; }

  /* H2H */
  .h2h-wrap { gap: 10px; }
  .h2h-lbl { font-size: 11px; }

  /* Chart */
  .chart-wrap { height: 150px; padding: 8px 6px 6px; }

  /* Year table */
  .yr-table { font-size: 11px; }
  .yr-table th, .yr-table td { padding: 7px 5px; white-space: nowrap; }

  /* Revenue table — horizontal scroll on mobile */
  .rev-table { font-size: 12px; }
  .rev-table th, .rev-table td { padding: 10px 12px; white-space: nowrap; }

  /* FU banner */
  .fu-today-banner { padding: 12px 14px; gap: 10px; }
  .fu-today-banner-title { font-size: 12px; }
  .fu-today-banner-sub { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fu-today-banner-count { font-size: 22px; }

  /* Active tap feedback for interactive rows */
  .leads-tbl tbody tr:active td { background: var(--s2); }
  .ldp-fu-btn:active { background: var(--s3); border-color: var(--b2); }

  /* Modal — bottom sheet iOS-optimized */
  .modal-overlay { align-items: flex-end; padding: 0; }
  .modal {
    width: 100%; border-radius: 22px 22px 0 0;
    border-left: none; border-right: none; border-bottom: none;
    max-height: 88dvh; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal-head { padding: 20px 20px 14px; }
  .modal-title { font-size: 18px; font-weight: 900; }
  .modal-sub { font-size: 12px; }
  /* Single-column form on mobile */
  .modal-body { padding: 16px 20px; gap: 14px; }
  .f-row { grid-template-columns: 1fr; gap: 14px; }
  .f input, .f select {
    font-size: 16px; padding: 14px 16px;
    border-radius: 12px;
    -webkit-appearance: none;
  }
  .f select { background-image: none; }
  .f label { font-size: 10px; letter-spacing: 1px; margin-bottom: 6px; }
  .modal-foot {
    padding: 14px 20px calc(20px + env(safe-area-inset-bottom));
    gap: 10px; border-top: 1px solid var(--b);
    display: flex; flex-direction: row;
  }
  .btn { padding: 14px 20px; font-size: 14px; border-radius: 12px; flex: 1; text-align: center; justify-content: center; }
  .btn-del { flex: none; }
  /* Modal drag handle */
  .modal::before {
    content: ''; display: block;
    width: 36px; height: 4px; border-radius: 99px;
    background: var(--muted2); margin: 12px auto 0;
  }

  /* FAB */
  .fab {
    display: flex !important; position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom)); right: 20px;
    width: 56px; height: 56px; background: var(--accent);
    border-radius: 50%; border: none; color: #fff; font-size: 26px; line-height: 1;
    align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(59,130,246,.5); z-index: 90;
    touch-action: manipulation; transition: transform .12s, box-shadow .12s;
  }
  .fab:active { transform: scale(.91); box-shadow: 0 4px 14px rgba(59,130,246,.3); }

  /* Metrics */
  .metrics-logo-row { margin-bottom: 20px; }
  .metrics-logo-row img { width: 34px; height: 34px; }
  .metrics-logo-row-name { font-size: 17px; }
  .metrics-period { margin-bottom: 24px; }
  .mp-btn { padding: 8px 14px; font-size: 11px; }
  .metrics-sec { margin-bottom: 24px; }
  .ms { padding: 20px 16px; }
  .ms-val { font-size: 44px; letter-spacing: -2px; }
  .ms-closer-val { font-size: 26px; }
  .metrics-grid.g4 { grid-template-columns: repeat(2,1fr); }
  .metrics-grid.g3 { grid-template-columns: repeat(2,1fr); }
  .metrics-grid.g2 { grid-template-columns: 1fr; }
  .targets-row { flex-direction: column; }
  .target-cur { font-size: 32px; }
  .comm-grid { grid-template-columns: 1fr; }
  .comm-amount { font-size: 40px; }
  .rev-kpis { grid-template-columns: repeat(2,1fr); }
}

/* FAB hidden on desktop / on leads tab */
.fab { display: none; }
.fab.fab-hidden { display: none !important; }

/* ── BOTTOM NAV (mobile only) ────────────── */
.bottom-nav { display: none; }

@media (max-width: 640px) {
  /* Hide top tabs — replaced by bottom nav */
  .toolbar { display: none !important; }

  /* Show bottom nav */
  .bottom-nav {
    display: flex;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 95;
    background: rgba(5,5,7,0.97);
    backdrop-filter: blur(24px) saturate(180%);
    border-top: 1px solid var(--b);
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  .bnav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 6px 2px 4px; background: none; border: none;
    color: var(--muted); font-family: var(--font);
    font-size: 9px; font-weight: 600; letter-spacing: .3px;
    cursor: pointer; transition: color .15s; touch-action: manipulation;
    position: relative;
  }
  .bnav-btn svg { width: 21px; height: 21px; opacity: .45; transition: opacity .15s; stroke: currentColor; }
  .bnav-btn.active { color: #fff; }
  .bnav-btn.active svg { opacity: 1; }
  .bnav-btn .bnav-pip {
    position: absolute; top: 5px; right: calc(50% - 16px);
    width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; opacity: 0; transition: opacity .15s;
  }
  .bnav-btn.active .bnav-pip { opacity: 1; }

  /* Lift FAB above bottom nav */
  .fab {
    bottom: calc(72px + env(safe-area-inset-bottom)) !important;
    right: 16px !important;
    width: 52px !important; height: 52px !important;
    font-size: 24px !important;
  }

  /* Main content clears bottom nav */
  main {
    padding-bottom: calc(86px + env(safe-area-inset-bottom)) !important;
  }

  /* Header — compact on mobile */
  .header-user {
    background: none !important;
    border-color: transparent !important;
    padding: 2px !important;
    gap: 0 !important;
  }
  .header-user-name, .header-logout { display: none !important; }
  .header-user-av { width: 34px !important; height: 34px !important; }
}

/* ── AUTH GATE ───────────────────────────── */
#auth-gate {
  position: fixed; inset: 0; z-index: 9998;
  background: #000;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .4s ease, visibility .4s ease;
}
#auth-gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.auth-card {
  display: flex; flex-direction: column; align-items: center; gap: 20px;
  width: 100%; max-width: 320px; text-align: center;
}
.auth-title { font-size: 18px; font-weight: 800; letter-spacing: -.3px; color: #fff; }
.auth-sub { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .2px; margin-top: -10px; }
.auth-google-btn {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  width: 100%; padding: 13px 24px; border-radius: 8px;
  border: none; background: #fff;
  color: #1f1f1f; font-family: var(--font); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .15s; letter-spacing: .1px;
  margin-top: 8px;
}
.auth-google-btn:hover { background: #f0f0f0; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,0,0,.4); }
.auth-google-btn svg { flex-shrink: 0; }
.auth-error { font-size: 12px; color: var(--red); background: rgba(244,63,94,.08); border: 1px solid rgba(244,63,94,.2); border-radius: 8px; padding: 10px 16px; width: 100%; }
.auth-divider { display: none; }
.auth-logo { display: none; }

/* Header user pill */
.header-user {
  display: flex; align-items: center; gap: 10px;
  background: var(--s2); border: 1px solid var(--b); border-radius: 99px;
  padding: 5px 14px 5px 6px;
}
.header-user-av {
  width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
  background: var(--s3); display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: var(--accent);
  overflow: hidden; flex-shrink: 0;
}
.header-user-av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.header-user-name { font-size: 12px; font-weight: 700; color: var(--text); }
.header-logout {
  background: none; border: none; color: var(--muted); font-size: 11px;
  font-family: var(--font); font-weight: 600; cursor: pointer;
  padding: 3px 8px; border-radius: 6px; transition: color .15s;
  white-space: nowrap;
}
.header-logout:hover { color: var(--red); }

/* ── LOADING SCREEN ──────────────────────── */
#loader {
  position: fixed; inset: 0; z-index: 9999;
  background: #000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 32px;
  transition: opacity .5s ease, visibility .5s ease;
}
#loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
#loader-logo {
  width: 72px; height: 72px;
  object-fit: contain;
  filter: drop-shadow(0 0 16px rgba(59,130,246,.4));
  animation: pulse-logo 2s ease-in-out infinite;
}
@keyframes pulse-logo {
  0%, 100% { filter: drop-shadow(0 0 10px rgba(59,130,246,.3)); }
  50%       { filter: drop-shadow(0 0 28px rgba(59,130,246,.7)); }
}
#loader-bar-wrap {
  width: 200px; height: 3px;
  background: rgba(255,255,255,0.08);
  border-radius: 99px;
  overflow: hidden;
  position: relative;
}
#loader-bar {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, #3b82f6, #60a5fa);
  box-shadow: 0 0 10px #3b82f6, 0 0 24px #3b82f6, 0 0 2px #fff;
  transition: width .1s linear;
}
#loader-bar-wrap::after {
  content: '';
  position: absolute; top: 50%; left: 0; right: 0;
  height: 12px; transform: translateY(-50%);
  background: linear-gradient(90deg, transparent, rgba(96,165,250,.25), transparent);
  border-radius: 99px;
  animation: glow-sweep 1.8s ease-in-out infinite;
}
@keyframes glow-sweep {
  0%   { opacity: 0; transform: translateY(-50%) scaleX(0); transform-origin: left; }
  50%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(-50%) scaleX(1); transform-origin: left; }
}
</style>
</head>

      calls:row.calls||0, pickups:row.pickups||0, dq:row.dq||0, followup:row.followup||0, close:row.close||0

  currentTab = tab;

  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

function gm(data, member, y, m) { return data[member]?.[y]?.[m] || {}; }
function sum(dm) {
  return Object.values(dm).reduce((s,d) => ({
    calls:s.calls+(d.calls||0), pickups:s.pickups+(d.pickups||0),
    dq:s.dq+(d.dq||0), followup:s.followup+(d.followup||0), close:s.close+(d.close||0)
  }), {calls:0,pickups:0,dq:0,followup:0,close:0});
}
function pct(a,b) { return b ? Math.round(a/b*100) : 0; }

function renderKPIs(data) {
  let s;
  if (currentTab === 'team') {
    const sM = sum(gm(data,'mateja',currentYear,currentMonth));

    s = sum(gm(data,currentTab,currentYear,currentMonth));
  }

      <div class="kpi-val" style="color:var(--accent)">${s.calls}</div>

    <div class="kpi" style="--stripe:${prColor}">
      <div class="kpi-label">Javljanja</div>
      <div class="kpi-val" style="color:${prColor}">${s.pickups}</div>

    </div>

      <div class="kpi-label">Diskvalifikovani</div>
      <div class="kpi-val" style="color:var(--red)">${s.dq}</div>
      <div class="kpi-sub">od ${s.pickups} javljanja</div>
    </div>
    <div class="kpi" style="--stripe:var(--yellow)">
      <div class="kpi-label">Follow Up</div>

      <div class="kpi-sub">U toku</div>
    </div>
    <div class="kpi" style="--stripe:var(--green)">
      <div class="kpi-label">Zatvoreni</div>
      <div class="kpi-val" style="color:var(--green)">${s.close}</div>

      <div class="kpi-label">Pickup Rate</div>
      <div class="kpi-val" style="color:${prColor}">${pr}%</div>

}

/* ── DAILY MORNING BRIEFING ─────────────────────────────────────
 * Personal greeting card shown at the top of each member's profile.
 * Pulls today's follow-ups, yesterday's close count, MTD progress.
 * Async-populates after initial render.
 * ─────────────────────────────────────────────────────────────── */
function renderMorningBriefing(data, member, color){
  const greeting = (() => {
    const h = new Date().getHours();
    if (h < 12)  return 'Dobro jutro';
    if (h < 18)  return 'Dobar dan';
    return 'Dobro veče';
  })();
  const mtd = sum(gm(data, member, currentYear, currentMonth));
  const t = getTargets();
  const closeTarget = t.close;
  const closePct = Math.min(100, Math.round((mtd.close / closeTarget) * 100));
  // Yesterday's close from daily_entries
  const y = new Date(); y.setDate(y.getDate()-1);
  const yd = data?.[member]?.[y.getFullYear()]?.[y.getMonth()]?.[y.getDate()] || {};
  const yClose = yd.close || 0;
  return `
    <div class="briefing-card" style="--bc:${color}">
      <div class="briefing-row">
        <div>
          <div class="briefing-greet">${greeting}, <span style="color:${color}">${cap(member)}</span> 👋</div>
          <div class="briefing-sub">Tvoj dan na jednom mestu</div>
        </div>
      </div>
      <div class="briefing-stats">
        <div class="briefing-stat">
          <div class="briefing-stat-val" id="brief-fu-${member}">—</div>
          <div class="briefing-stat-lbl">Follow-up danas</div>
        </div>
        <div class="briefing-stat">
          <div class="briefing-stat-val" style="color:var(--green)">${yClose}</div>
          <div class="briefing-stat-lbl">Juče zatvoreno</div>
        </div>
        <div class="briefing-stat">
          <div class="briefing-stat-val" style="color:${color}">${mtd.close}<span style="font-size:14px;color:var(--muted);font-weight:600">/${closeTarget}</span></div>
          <div class="briefing-stat-lbl">MTD close (${closePct}%)</div>
        </div>
        <div class="briefing-stat">
          <div class="briefing-stat-val" id="brief-stale-${member}">—</div>
          <div class="briefing-stat-lbl">Stale leadovi</div>
        </div>
      </div>
      <div class="briefing-bar"><div class="briefing-bar-fill" style="width:${closePct}%;background:linear-gradient(90deg, ${color}, var(--green))"></div></div>
    </div>
  `;
}

async function populateBriefingCounts(member){
  const todayStr = new Date().toISOString().slice(0,10);
  const fourteenDaysAgo = new Date(); fourteenDaysAgo.setDate(fourteenDaysAgo.getDate()-14);
  const fourteenDaysStr = fourteenDaysAgo.toISOString();

  const [fuR, staleR] = await Promise.all([
    sb.from('ghl_leads').select('id',{count:'exact',head:true})
      .eq('assigned_to',member).eq('follow_up_date',todayStr)
      .neq('status','Closed').neq('status','DQ'),
    sb.from('ghl_leads').select('id',{count:'exact',head:true})
      .eq('assigned_to',member)
      .neq('status','Closed').neq('status','DQ')
      .lt('date_added', fourteenDaysStr)
      .or(`follow_up_date.is.null,follow_up_date.lt.${fourteenDaysAgo.toISOString().slice(0,10)}`),
  ]);
  const fuEl    = document.getElementById('brief-fu-'+member);
  const staleEl = document.getElementById('brief-stale-'+member);
  if (fuEl)    fuEl.textContent = fuR.count || 0;
  if (staleEl) {
    staleEl.textContent = staleR.count || 0;
    if ((staleR.count || 0) > 0) staleEl.style.color = 'var(--red)';
  }
}

async function loadMemberFollowUps(member){
  const listEl=document.getElementById('member-fu-list');
  const cntEl=document.getElementById('member-fu-count');
  if(!listEl)return;
  const todayStr=new Date().toISOString().slice(0,10);
  const {data,error}=await sb.from('ghl_leads')
    .select('id,name,phone,email,instagram,follow_up_date,status,lead_type,tags')
    .eq('assigned_to',member)
    .not('follow_up_date','is',null)
    .neq('status','Closed')
    .neq('status','DQ')
    .order('follow_up_date',{ascending:true})
    .limit(500);
  if(error){listEl.innerHTML=`<div style="text-align:center;padding:20px;color:var(--red);font-size:12px">Greška: ${esc(error.message)}</div>`;return;}
  const leads=data||[];
  const overdue=leads.filter(l=>l.follow_up_date<todayStr);
  const today=leads.filter(l=>l.follow_up_date===todayStr);
  const upcoming=leads.filter(l=>l.follow_up_date>todayStr);
  if(cntEl) cntEl.textContent=`${leads.length} ukupno · ${overdue.length} kasni · ${today.length} danas`;
  if(!leads.length){
    listEl.innerHTML=`<div style="text-align:center;padding:32px 16px;color:var(--muted);font-size:13px"><div style="font-size:24px;margin-bottom:8px">✨</div><div style="font-weight:700">Nema zakazanih follow-up poziva</div></div>`;
    return;
  }
  const row=l=>{
    const cls=l.follow_up_date<todayStr?'fu-overdue':l.follow_up_date===todayStr?'fu-today':'';
    const dt=new Date(l.follow_up_date+'T00:00').toLocaleDateString('sr-RS',{day:'numeric',month:'short'});
    const meta=[l.phone,l.instagram?`@${l.instagram.replace('@','')}`:''].filter(Boolean).join(' · ');
    return `<div class="mfu-row" onclick="openLeadDetailFromMember('${esc(l.id)}')">
      <div class="mfu-date ${cls}">${dt}</div>
      <div class="mfu-name"><div style="font-weight:700;font-size:13px">${esc(l.name||'Nepoznat')}${contactActions(l)}</div>${meta?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(meta)}</div>`:''}</div>
      <div class="mfu-status">${esc(l.status||'Novi')}</div>
      <span class="ltr-arrow" style="margin-left:auto">›</span>
    </div>`;
  };
  const section=(title,arr,color)=>arr.length?`<div class="mfu-section"><div class="mfu-section-lbl" style="color:${color}">${title} · ${arr.length}</div>${arr.map(row).join('')}</div>`:'';
  listEl.innerHTML=`
    ${section('Kasni',overdue,'var(--red)')}
    ${section('Danas',today,'var(--yellow)')}

function buildChartData(data, period) {
  const now = new Date();
  const labels=[], callsM=[], callsD=[], closeM=[], closeD=[];

  const dayPoint=(dt)=>{
    const dM=data['mateja']?.[dt.getFullYear()]?.[dt.getMonth()]?.[dt.getDate()]||{};
    const dD=data['dusica']?.[dt.getFullYear()]?.[dt.getMonth()]?.[dt.getDate()]||{};
    callsM.push(dM.calls||0); callsD.push(dD.calls||0);
    closeM.push(dM.close||0); closeD.push(dD.close||0);
  };

  if(period==='today'||period==='yesterday'){
    const dt=period==='today'?now:new Date(now.getTime()-86400000);
    labels.push(dt.toLocaleDateString('sr-RS',{day:'2-digit',month:'short'}));
    dayPoint(dt);
    return{labels,callsM,callsD,closeM,closeD};
  }
  if(period==='week'||period==='lastweek'){
    const dow=now.getDay(); const diff=dow===0?6:dow-1;
    const start=new Date(now); start.setDate(start.getDate()-diff-(period==='lastweek'?7:0)); start.setHours(0,0,0,0);
    const DAYS=['Pon','Uto','Sre','Čet','Pet','Sub','Ned'];
    for(let i=0;i<7;i++){
      const dt=new Date(start); dt.setDate(dt.getDate()+i);
      labels.push(DAYS[i]); dayPoint(dt);
    }
    return{labels,callsM,callsD,closeM,closeD};
  }
  if(period==='month'||period==='last'){
    let y=currentYear, m=currentMonth;
    if(period==='last'){m--;if(m<0){m=11;y--;}}
    const days=new Date(y,m+1,0).getDate();
    for(let d=1;d<=days;d++){
      labels.push(String(d));
      const dM=data['mateja']?.[y]?.[m]?.[d]||{};
      const dD=data['dusica']?.[y]?.[m]?.[d]||{};
      callsM.push(dM.calls||0); callsD.push(dD.calls||0);
      closeM.push(dM.close||0); closeD.push(dD.close||0);
    }
    return{labels,callsM,callsD,closeM,closeD};
  }
  // 'all' — by month
  const md={};
  ['mateja','dusica'].forEach(mb=>{
    Object.entries(data[mb]||{}).forEach(([y,yd])=>{
      Object.entries(yd||{}).forEach(([mo,mdd])=>{
        const key=`${y}-${String(mo).padStart(2,'0')}`;
        if(!md[key])md[key]={y:+y,m:+mo,M:{calls:0,close:0},D:{calls:0,close:0}};
        Object.values(mdd||{}).forEach(dd=>{
          if(mb==='mateja'){md[key].M.calls+=dd.calls||0;md[key].M.close+=dd.close||0;}
          else{md[key].D.calls+=dd.calls||0;md[key].D.close+=dd.close||0;}
        });
      });
    });
  });
  Object.entries(md).sort(([a],[b])=>a.localeCompare(b)).forEach(([,v])=>{
    labels.push(MONTHS3[v.m]);
    callsM.push(v.M.calls); callsD.push(v.D.calls);
    closeM.push(v.M.close); closeD.push(v.D.close);
  });
  return{labels,callsM,callsD,closeM,closeD};
}

// Sum entries within a date range across both members
function sumRange(data, member, startDate, endDate) {
  const r = {calls:0,pickups:0,dq:0,followup:0,close:0};
  const start = new Date(startDate.y, startDate.m, startDate.d);
  const end   = new Date(endDate.y,   endDate.m,   endDate.d);
  Object.entries(data[member]||{}).forEach(([y,yd])=>{
    Object.entries(yd||{}).forEach(([mo,md])=>{
      Object.entries(md||{}).forEach(([d,dd])=>{
        const dt = new Date(+y, +mo, +d);
        if(dt>=start && dt<=end){
          r.calls+=dd.calls||0; r.pickups+=dd.pickups||0;
          r.dq+=dd.dq||0; r.followup+=dd.followup||0; r.close+=dd.close||0;
        }
      });
    });
  });
  return r;
}

function getStatsForPeriod(data, period) {
  const now = new Date();
  const tod = {y:now.getFullYear(), m:now.getMonth(), d:now.getDate()};

  if(period==='today'){
    return { sM:sumRange(data,'mateja',tod,tod), sD:sumRange(data,'dusica',tod,tod) };
  }
  if(period==='yesterday'){
    const yy = new Date(now); yy.setDate(yy.getDate()-1);
    const yd = {y:yy.getFullYear(), m:yy.getMonth(), d:yy.getDate()};
    return { sM:sumRange(data,'mateja',yd,yd), sD:sumRange(data,'dusica',yd,yd) };
  }
  if(period==='week'){
    const dow = now.getDay(); const diff = dow===0?6:dow-1;
    const mon = new Date(now); mon.setDate(mon.getDate()-diff);
    const start = {y:mon.getFullYear(), m:mon.getMonth(), d:mon.getDate()};
    return { sM:sumRange(data,'mateja',start,tod), sD:sumRange(data,'dusica',start,tod) };
  }
  if(period==='lastweek'){
    const dow = now.getDay(); const diff = dow===0?6:dow-1;
    const thisMon = new Date(now); thisMon.setDate(thisMon.getDate()-diff);
    const lastSun = new Date(thisMon); lastSun.setDate(lastSun.getDate()-1);
    const lastMon = new Date(thisMon); lastMon.setDate(lastMon.getDate()-7);
    const s = {y:lastMon.getFullYear(), m:lastMon.getMonth(), d:lastMon.getDate()};
    const e = {y:lastSun.getFullYear(), m:lastSun.getMonth(), d:lastSun.getDate()};
    return { sM:sumRange(data,'mateja',s,e), sD:sumRange(data,'dusica',s,e) };
  }
  if(period==='month'){
    return { sM:sum(gm(data,'mateja',currentYear,currentMonth)), sD:sum(gm(data,'dusica',currentYear,currentMonth)) };
  }
  if(period==='last'){
    let lm=currentMonth-1, ly=currentYear; if(lm<0){lm=11;ly--;}
    return { sM:sum(gm(data,'mateja',ly,lm)), sD:sum(gm(data,'dusica',ly,lm)) };
  }
  // 'all'
  const aggM={}, aggD={};
  ['mateja','dusica'].forEach(mb=>{
    const dest = mb==='mateja'?aggM:aggD;
    Object.entries(data[mb]||{}).forEach(([y,yd])=>{
      Object.entries(yd||{}).forEach(([mo,md])=>{
        Object.entries(md||{}).forEach(([d,dd])=>{ dest[`${y}-${mo}-${d}`]=dd; });
      });
    });
  });
  return { sM:sum(aggM), sD:sum(aggD) };
}

async function renderWolfTab(){
  const el=document.getElementById('mainContent');
  el.innerHTML='<div class="empty"><div class="empty-icon">🐺</div><div class="empty-text">Učitavam...</div></div>';
  const data=await loadData();

  function wolfScore(s){
    const cr=s.pickups>0?s.close/s.pickups*100:0;
    const pr=s.calls>0?s.pickups/s.calls*100:0;
    return s.close*10 + s.calls*0.1 + cr*1.5 + pr*0.3;
  }

  const sM=sum(gm(data,'mateja',currentYear,currentMonth));
  const sD=sum(gm(data,'dusica',currentYear,currentMonth));
  const scM=wolfScore(sM), scD=wolfScore(sD);
  const maxSc=Math.max(scM,scD);
  const leader = maxSc===0 ? 'tie'
    : (scM===maxSc && scD!==maxSc) ? 'mateja'
    : (scD===maxSc && scM!==maxSc) ? 'dusica'
    : 'tie';
  const leaderScore = leader==='mateja'?scM:leader==='dusica'?scD:0;
  const leaderColor = leader==='mateja'?'var(--mateja)':leader==='dusica'?'var(--dusica)':'var(--text)';
  const leaderName = leader==='mateja'?'Mateja':leader==='dusica'?'Dusica':'Remi';

  // Build months with data
  const months=[];
  for(let m=0;m<=11;m++){
    const mm=sum(gm(data,'mateja',currentYear,m));
    const md=sum(gm(data,'dusica',currentYear,m));
    if(mm.calls===0&&md.calls===0)continue;
    const sm=wolfScore(mm),sd=wolfScore(md);
    const mx=Math.max(sm,sd);
    const winner = mx===0 ? 'tie'
      : (sm===mx && sd!==mx) ? 'm'
      : (sd===mx && sm!==mx) ? 'd'
      : 'tie';
    months.push({month:m,m:mm,d:md,sm,sd,winner});
  }

  const winsM=months.filter(x=>x.winner==='m').length;
  const winsD=months.filter(x=>x.winner==='d').length;

  // Win streak
  let streakM=0,streakD=0;
  for(let i=months.length-1;i>=0;i--){
    const w=months[i].winner;
    if(w==='m'){if(streakD===0)streakM++;else break;}
    else if(w==='d'){if(streakM===0)streakD++;else break;}
    else break;
  }
  const streaker = streakM>1?`🔥 Mateja ${streakM} meseca zaredom`
    : streakD>1?`🔥 Dusica ${streakD} meseca zaredom`
    : '';
  const maxWins=Math.max(winsM,winsD);

  const M3=['Jan','Feb','Mar','Apr','Maj','Jun','Jul','Avg','Sep','Okt','Nov','Dec'];

  el.innerHTML=`<div class="wolf-wrap">

    <!-- HERO -->
    <div class="wolf-hero">
      <div class="wolf-badge">🐺 Top Wolf · ${M3[currentMonth]} ${currentYear}</div>
      <div class="wolf-hero-title" style="color:${leaderColor}">
        ${leaderName}
      </div>
      <div class="wolf-hero-sub">
        ${leader!=='tie'?`${Math.round(leaderScore)} bodova ovog meseca`:'Izjednačeno — niko se nije istakao'}
      </div>

      <div class="wolf-score-row">
        <div class="wolf-score-card ${leader==='mateja'?'wolf-leader':''}">
          ${leader==='mateja'?'<div class="wolf-crown">👑</div>':''}
          <div class="wolf-sc-av mateja"><img src="mateja.png" alt="M"/></div>
          <div class="wolf-sc-name">Mateja</div>
          <div class="wolf-sc-pts" style="color:var(--mateja)">${Math.round(scM)}</div>
          <div class="wolf-sc-label">bodova</div>
          <div class="wolf-sc-stats">
            <span>${sM.close} zat.</span>
            <span>${pct(sM.close,sM.pickups)}% CR</span>
            <span>${sM.calls} poz.</span>
          </div>
        </div>
        <div class="wolf-score-card ${leader==='dusica'?'wolf-leader':''}">
          ${leader==='dusica'?'<div class="wolf-crown">👑</div>':''}
          <div class="wolf-sc-av dusica"><img src="dusica.png" alt="D"/></div>
          <div class="wolf-sc-name">Dusica</div>
          <div class="wolf-sc-pts" style="color:var(--dusica)">${Math.round(scD)}</div>
          <div class="wolf-sc-label">bodova</div>
          <div class="wolf-sc-stats">
            <span>${sD.close} zat.</span>
            <span>${pct(sD.close,sD.pickups)}% CR</span>
            <span>${sD.calls} poz.</span>
          </div>
        </div>
      </div>
    </div>

    <!-- SEASON RECORD -->
    <div class="wolf-section">
      <div class="wolf-sec-lbl">Sezona ${currentYear}</div>
      <div class="wolf-record-row">
        <div class="wolf-record ${winsM===maxWins&&winsM>0?'leading':''}" style="--c:var(--mateja)">
          <div class="wolf-rec-val">${winsM}</div>
          <div class="wolf-rec-lbl">Mateja</div>
        </div>
        <div class="wolf-record-vs">:</div>
        <div class="wolf-record ${winsD===maxWins&&winsD>0?'leading':''}" style="--c:var(--dusica)">
          <div class="wolf-rec-val">${winsD}</div>
          <div class="wolf-rec-lbl">Dusica</div>
        </div>
      </div>
      ${streaker?`<div class="wolf-streak">${streaker}</div>`:''}
    </div>

    <!-- MONTHLY BREAKDOWN -->
    <div class="wolf-section">
      <div class="wolf-sec-lbl">Mesečni Obračun</div>
      ${months.length===0?`<div class="wolf-empty">Nema podataka za ${currentYear}</div>`:`
      <div class="wolf-month-list">
        ${[...months].reverse().map(m=>{
          const totSc=m.sm+m.sd;
          const wM=totSc>0?Math.round(m.sm/totSc*100):50;
          const wD=Math.max(0,100-wM);
          const medal=(w)=>m.winner===w?'🥇':m.winner==='tie'?'🤝':'🥈';
          return `
          <div class="wolf-month-row">
            <div class="wolf-month-name">${M3[m.month]}</div>
            <div class="wolf-month-stat ${m.winner==='m'?'wolf-win-m':''}">
              ${medal('m')}
              <span>${m.m.close}</span>
              <span class="wolf-month-sub">${pct(m.m.close,m.m.pickups)}%</span>
            </div>
            <div class="wolf-month-bar-wrap">
              <div class="wolf-bar-m" style="width:${wM}%"></div>
              <div class="wolf-bar-d" style="width:${wD}%"></div>
            </div>
            <div class="wolf-month-stat ${m.winner==='d'?'wolf-win-d':''}">
              <span>${m.d.close}</span>
              <span class="wolf-month-sub">${pct(m.d.close,m.d.pickups)}%</span>
              ${medal('d')}
            </div>
          </div>
        `;}).join('')}
      </div>`}
    </div>

  </div>`;
}

/* ── MANAGER DASHBOARD ──────────────────────────────────────────
 * Manager-only single-screen overview. Shows per-rep:
 *   - Calls today vs target
 *   - Closes today / this week / this month
 *   - Open pipeline ($)
 *   - Top stale lead (oldest "Follow Up" untouched)
 *   - Last activity time
 * + team-wide totals at the top.
 * ─────────────────────────────────────────────────────────────── */
async function renderManagerDashboard(){
  const el = document.getElementById('mainContent');
  el.innerHTML = `<div class="empty"><div class="empty-icon" style="font-size:20px">⏳</div><div class="empty-text">Učitavam pregled...</div></div>`;

  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);
  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);

  const data = await loadData();
  const members = ['mateja', 'dusica'];

  const repStats = await Promise.all(members.map(async (m) => {
    const t = getTargets();
    // Daily entries for today / week / MTD
    const dt = data?.[m]?.[today.getFullYear()]?.[today.getMonth()]?.[today.getDate()] || {};
    const mtd = sum(gm(data, m, today.getFullYear(), today.getMonth()));
    // Weekly close count
    let weekClose = 0, weekCalls = 0;
    for (let d = new Date(weekAgo); d <= today; d.setDate(d.getDate()+1)) {
      const e = data?.[m]?.[d.getFullYear()]?.[d.getMonth()]?.[d.getDate()];
      if (e) { weekClose += e.close||0; weekCalls += e.calls||0; }
    }
    // Open pipeline $
    const { data: openLeads } = await sb.from('ghl_leads')
      .select('deal,status,date_added,follow_up_date')
      .eq('assigned_to', m)
      .neq('status','Closed').neq('status','DQ');
    let pipeline = 0;
    (openLeads||[]).forEach(l => {
      if (l.deal && DEAL_PRICES[l.deal]) pipeline += DEAL_PRICES[l.deal];
    });
    // Stale count
    const fourteen = new Date(); fourteen.setDate(fourteen.getDate()-14);
    const fourteenIso = fourteen.toISOString();
    const fourteenDay = fourteen.toISOString().slice(0,10);
    const stale = (openLeads||[]).filter(l =>
      (!l.date_added || l.date_added < fourteenIso) &&
      (!l.follow_up_date || l.follow_up_date < fourteenDay)
    ).length;
    // Last activity timestamp
    const { data: lastAct } = await sb.from('lead_activities')
      .select('created_at')
      .eq('actor_email', `${m === 'mateja' ? '' : ''}`)  // We don't track per-rep; skip
      .order('created_at', { ascending: false }).limit(1);
    return {
      member: m, daily: dt, mtd, weekClose, weekCalls, pipeline, stale,
      callTarget: t.calls, closeTarget: t.close,
    };
  }));

  const totalPipeline = repStats.reduce((s,r) => s+r.pipeline, 0);
  const totalCloseMTD = repStats.reduce((s,r) => s+r.mtd.close, 0);
  const totalCallToday = repStats.reduce((s,r) => s+(r.daily.calls||0), 0);
  const totalStale = repStats.reduce((s,r) => s+r.stale, 0);

  const repCards = repStats.map(r => {
    const color = r.member === 'mateja' ? 'var(--mateja)' : 'var(--dusica)';
    const callPct = Math.min(100, Math.round(((r.daily.calls||0) / Math.max(1, Math.round(r.callTarget/22))) * 100));
    const closePct = Math.min(100, Math.round((r.mtd.close / r.closeTarget) * 100));
    return `<div class="md-rep" style="--rc:${color}">
      <div class="md-rep-head">
        <img class="md-rep-av" src="${r.member}.png" alt="${r.member}"/>
        <div>
          <div class="md-rep-name">${cap(r.member)}</div>
          <div class="md-rep-sub">Danas: ${r.daily.calls||0} poziva · ${r.daily.close||0} closes</div>
        </div>
      </div>
      <div class="md-rep-grid">
        <div class="md-stat">
          <div class="md-stat-val" style="color:${color}">${r.mtd.close}<span style="font-size:13px;color:var(--muted)">/${r.closeTarget}</span></div>
          <div class="md-stat-lbl">MTD CLOSE</div>
          <div class="md-stat-bar"><div class="md-stat-bar-fill" style="width:${closePct}%;background:${color}"></div></div>
        </div>
        <div class="md-stat">
          <div class="md-stat-val">${r.weekClose}</div>
          <div class="md-stat-lbl">7-dnevni Close</div>
        </div>
        <div class="md-stat">
          <div class="md-stat-val">${r.weekCalls}</div>
          <div class="md-stat-lbl">7-dnevni Pozivi</div>
        </div>
        <div class="md-stat">
          <div class="md-stat-val" style="color:var(--green)">$${r.pipeline.toLocaleString('sr-RS')}</div>
          <div class="md-stat-lbl">Open Pipeline</div>
        </div>
        <div class="md-stat">
          <div class="md-stat-val" style="color:${r.stale>5?'var(--red)':r.stale>0?'var(--yellow)':'var(--muted)'}">${r.stale}</div>
          <div class="md-stat-lbl">Stale leadovi</div>
        </div>
        <div class="md-stat">
          <div class="md-stat-val">${r.daily.calls||0}<span style="font-size:13px;color:var(--muted)">/${Math.round(r.callTarget/22)}</span></div>
          <div class="md-stat-lbl">Pozivi danas</div>
          <div class="md-stat-bar"><div class="md-stat-bar-fill" style="width:${callPct}%;background:${color}"></div></div>
        </div>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `<div class="md-wrap">
    <div class="md-header">
      <div>
        <div class="md-title">📊 Pregled tima</div>
        <div class="md-sub">${new Date().toLocaleDateString('sr-RS',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
      </div>
    </div>

    <div class="md-totals">
      <div class="md-total">
        <div class="md-total-val">${totalCallToday}</div>
        <div class="md-total-lbl">Poziva DANAS</div>
      </div>
      <div class="md-total">
        <div class="md-total-val" style="color:var(--green)">${totalCloseMTD}</div>
        <div class="md-total-lbl">Closes MTD</div>
      </div>
      <div class="md-total">
        <div class="md-total-val" style="color:var(--green)">$${totalPipeline.toLocaleString('sr-RS')}</div>
        <div class="md-total-lbl">Open Pipeline</div>
      </div>
      <div class="md-total">
        <div class="md-total-val" style="color:${totalStale>10?'var(--red)':totalStale>0?'var(--yellow)':'var(--green)'}">${totalStale}</div>
        <div class="md-total-lbl">Stale leadovi</div>
      </div>
    </div>

    <div class="md-reps">${repCards}</div>

    <div class="md-actions">
      <button class="md-action-btn" onclick="autoAssignUnassigned().then(showRoundRobinToast)">🎯 Round-robin nedodeljenih</button>
      <button class="md-action-btn" onclick="autoRecycleFollowUps().then(r=>{showRecycleToast(r); if(!r)alert('Nema stale Follow-Up leadova za reciklažu.');})">🔁 Reciklažu stale FU</button>
      <button class="md-action-btn" onclick="syncClosedFromSheet({force:true}).then(r=>{showSheetSyncToast(r); if(r&&!r.updated)alert('Sheet već sinhronizovan — nema novih closes.');})">📊 Sync Sheet → CRM</button>
    </div>
  </div>`;
}

/* ── BEST-TIME-TO-CALL HEATMAP ──────────────────────────────────
 * 7x24 grid colored by activity volume. Uses lead_activities
 * timestamps as a proxy for when reps successfully engage leads.
 * Filtered to action_type IN (status, followup, note) to focus on
 * "real touchpoints" rather than passive activity.
 * ─────────────────────────────────────────────────────────────── */
async function renderHeatmapSection(){
  const host = document.getElementById('heatmap-section');
  if (!host) return;
  host.innerHTML = `<div class="metrics-sec">
    <div class="metrics-sec-lbl">NAJBOLJE VREME ZA POZIV — Heatmap aktivnosti</div>
    <div style="padding:24px;text-align:center;color:var(--muted);font-size:12px">⏳ Učitavam...</div>
  </div>`;
  // Last 90 days of touch activity
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-90);
  const { data, error } = await sb.from('lead_activities')
    .select('created_at,action_type,new_value')
    .gte('created_at', cutoff.toISOString())
    .in('action_type', ['status','followup','note'])
    .limit(20000);
  if (error) {
    host.innerHTML = `<div class="metrics-sec"><div class="metrics-sec-lbl">NAJBOLJE VREME ZA POZIV — Heatmap aktivnosti</div><div style="padding:24px;color:var(--red);font-size:12px;text-align:center">${esc(error.message)}</div></div>`;
    return;
  }
  const grid = Array.from({length:7}, () => Array(24).fill(0));
  let pickupGrid = Array.from({length:7}, () => Array(24).fill(0));
  (data||[]).forEach(a => {
    const d = new Date(a.created_at);
    const dow = (d.getDay() + 6) % 7;  // Mon=0..Sun=6
    const hr  = d.getHours();
    grid[dow][hr]++;
    if (a.action_type === 'status' && (a.new_value === 'Follow Up' || a.new_value === 'Closed')) {
      pickupGrid[dow][hr]++;
    }
  });
  const max = Math.max(1, ...grid.flat());
  const days = ['Pon','Uto','Sre','Čet','Pet','Sub','Ned'];
  const cells = [];
  for (let d = 0; d < 7; d++) {
    cells.push(`<div class="hm-row"><div class="hm-day">${days[d]}</div>${grid[d].map((v,h) => {
      const intensity = v / max;
      const successRate = v > 0 ? Math.round((pickupGrid[d][h]/v)*100) : 0;
      const bg = v === 0 ? 'transparent' : `rgba(34,197,94,${Math.max(0.06, intensity)})`;
      return `<div class="hm-cell" style="background:${bg}" title="${days[d]} ${h}:00 · ${v} aktivnosti · ${successRate}% pickup"></div>`;
    }).join('')}</div>`);
  }
  const hrLabels = [];
  for (let h = 0; h < 24; h++) hrLabels.push(`<span>${h%6===0?h:''}</span>`);
  host.innerHTML = `<div class="metrics-sec">
    <div class="metrics-sec-lbl">NAJBOLJE VREME ZA POZIV — Heatmap aktivnosti</div>
    <div class="hm-wrap">
      <div class="hm-hr-row"><div class="hm-day"></div>${hrLabels.join('')}</div>
      ${cells.join('')}

/* ── CONVERSION FUNNEL ───────────────────────────────────────────
 * Visualizes the webinar funnel: Webinar Lead → Attended → Qualified → Closed.
 * Uses Supabase head counts on tracker tags, and ghl_leads.status='Closed'
 * for the bottom stage, restricted to contacts that ever had a webinar tag.
 * ─────────────────────────────────────────────────────────────── */
async function renderFunnelSection(){
  const host = document.getElementById('funnel-section');
  if (!host) return;
  host.innerHTML = `<div class="metrics-sec">
    <div class="metrics-sec-lbl">PRODAJNI LIJEVAK — Webinar Funnel</div>
    <div style="padding:24px;text-align:center;color:var(--muted);font-size:12px">⏳ Učitavam...</div>
  </div>`;

  const webinarTags = ['webinar-lead','qualified-webinar','disqualified-webinar','prisustvovao-webinaru'];

  const [regR, attR, qualR, closedR] = await Promise.all([
    sb.from('ghl_leads').select('id',{count:'exact',head:true}).overlaps('tags', webinarTags),
    sb.from('ghl_leads').select('id',{count:'exact',head:true}).overlaps('tags', ['prisustvovao-webinaru']),
    sb.from('ghl_leads').select('id',{count:'exact',head:true}).overlaps('tags', ['qualified-webinar']),
    sb.from('ghl_leads').select('id',{count:'exact',head:true}).overlaps('tags', webinarTags).eq('status','Closed'),
  ]);

  const stages = [
    { key:'reg',    label:'Prijavili se na webinar',  count: regR.count||0,    color:'#3b82f6' },
    { key:'att',    label:'Prisustvovali webinaru',   count: attR.count||0,    color:'#a855f7' },
    { key:'qual',   label:'Qualified (post-webinar)', count: qualR.count||0,   color:'#f59e0b' },
    { key:'closed', label:'Closed',                   count: closedR.count||0, color:'#22c55e' },
  ];
  const top = stages[0].count || 1;
  const pctOf = n => Math.round((n / top) * 100);
  const drop  = (a,b) => a === 0 ? 0 : Math.round(((a-b)/a) * 100);
  const conv  = (a,b) => a === 0 ? 0 : Math.round((b/a) * 100);

  host.innerHTML = `<div class="metrics-sec">
    <div class="metrics-sec-lbl">PRODAJNI LIJEVAK — Webinar Funnel</div>
    <div class="funnel-wrap">
      ${stages.map((s, i) => {
        const w = pctOf(s.count);
        const prev = i>0 ? stages[i-1] : null;
        const dropPct = prev ? drop(prev.count, s.count) : 0;
        const convPct = prev ? conv(prev.count, s.count) : 100;
        return `
          ${prev ? `<div class="funnel-arrow">
            <span class="funnel-arrow-conv" style="color:${dropPct<50?'var(--green)':dropPct<75?'var(--yellow)':'var(--red)'}">▼ ${dropPct}% otpalo</span>
            <span class="funnel-arrow-survive">${convPct}% prošlo dalje</span>
          </div>` : ''}
          <div class="funnel-stage">
            <div class="funnel-bar" style="width:${Math.max(w,12)}%;background:linear-gradient(90deg, ${s.color}40, ${s.color}99)">
              <span class="funnel-stage-count" style="color:${s.color}">${s.count.toLocaleString('sr-RS')}</span>
            </div>
            <div class="funnel-stage-lbl">${s.label}</div>
          </div>
        `;
      }).join('')}
      <div class="funnel-summary">
        <div class="funnel-summary-row">
          <span class="funnel-summary-lbl">Ukupna konverzija (prijava → close)</span>
          <span class="funnel-summary-val" style="color:var(--green)">${conv(stages[0].count, stages[3].count)}%</span>
        </div>
        <div class="funnel-summary-row">
          <span class="funnel-summary-lbl">Show-up rate (prijava → prisustvo)</span>
          <span class="funnel-summary-val">${conv(stages[0].count, stages[1].count)}%</span>
        </div>
        <div class="funnel-summary-row">
          <span class="funnel-summary-lbl">Close rate qualified-a</span>
          <span class="funnel-summary-val">${conv(stages[2].count, stages[3].count)}%</span>
        </div>
      </div>
    </div>
  </div>`;
}

/* ─────────────────── AI LEAD SUMMARY ──────────────────────────────
 * Calls /api/lead-summary which uses Anthropic's Claude to produce a
 * 3-sentence sales brief in Serbian. Cached per-lead in Supabase
 * (column ghl_leads.ai_summary) so we only burn a token when the
 * underlying data changes or the rep clicks "regenerate".
 *
 * Requires this Supabase SQL once:
 *   alter table ghl_leads add column if not exists ai_summary text;
 *   alter table ghl_leads add column if not exists ai_summary_at timestamptz;
 *
 * And ANTHROPIC_API_KEY set in Vercel env vars.
 * ─────────────────────────────────────────────────────────────── */
async function generateLeadSummary(leadId, force = false){
  const lead = (cachedLeads||[]).find(l => l.id === leadId);
  if (!lead) return;
  const host = document.getElementById('ai-summary-body');
  if (!host) return;

  if (!force && lead.ai_summary) {
    renderLeadSummary(lead);
    return;
  }

  host.innerHTML = `<div style="display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px"><span class="ai-spinner"></span> Generišem sažetak...</div>`;
  try {
    const r = await fetch('/api/lead-summary', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lead }),
    });
    const json = await r.json();
    if (!r.ok) {
      host.innerHTML = `<div style="color:var(--red);font-size:12px;font-weight:600">${esc(json.error || 'Greška: '+r.status)}</div>`;
      return;
    }
    lead.ai_summary = json.summary;
    lead.ai_summary_at = new Date().toISOString();
    // Cache to Supabase (no-op if columns don't exist)
    try {
      await sb.from('ghl_leads')
        .update({ ai_summary: json.summary, ai_summary_at: lead.ai_summary_at })
        .eq('id', leadId);
    } catch {}
    renderLeadSummary(lead);
  } catch (e) {
    host.innerHTML = `<div style="color:var(--red);font-size:12px">Greška: ${esc(e.message)}</div>`;
  }
}

function renderLeadSummary(lead){
  const host = document.getElementById('ai-summary-body');
  if (!host) return;
  if (!lead.ai_summary) {
    host.innerHTML = `
      <button class="ai-gen-btn" onclick="generateLeadSummary('${esc(lead.id)}', true)">
        ✨ Generiši AI sažetak
      </button>
      <div style="font-size:10px;color:var(--muted2);margin-top:6px">Claude će napisati 3-rečenični brief za ovog leada.</div>`;

/* ─────────────────── AI WHATSAPP MESSAGE ─────────────────────────
 * Generates a personalized first-touch WhatsApp message in Serbian
 * via /api/lead-message and opens wa.me with it pre-filled.
 * ─────────────────────────────────────────────────────────────── */
async function sendAIMessage(leadId){
  const lead = (cachedLeads||[]).find(l => l.id === leadId);
  if (!lead) return;
  if (!lead.phone) { alert('Nema broja za WhatsApp.'); return; }

  // Inline progress UI on the trigger button
  const btn = document.querySelector(`[data-ai-msg="${leadId}"]`);
  if (btn) { btn.innerHTML = '<span class="ai-spinner"></span> Pišem poruku...'; btn.disabled = true; }
  try {
    const r = await fetch('/api/lead-message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lead }),
    });
    const json = await r.json();
    if (!r.ok) {
      alert('Greška: ' + (json.error || r.status));
      return;
    }
    const phone = cleanPhone(lead.phone).replace(/^\+/, '');
    if (!phone) { alert('Telefon nije validan.'); return; }
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(json.message)}`;

    logActivity(leadId, 'note', null, '[AI message] '+json.message.slice(0,140));
  } catch (e) {
    alert('Greška: ' + e.message);
  } finally {
    if (btn) { btn.innerHTML = '✨ AI Poruka'; btn.disabled = false; }
  }
}

/* ─────────────────── AUTO-RECYCLE STALE FOLLOW-UPS ────────────────
 * Leads sitting in "Follow Up" with no activity for 14+ days get
 * auto-reset to "Novi" and tagged so reps see them again. Runs
 * once per day via localStorage flag.
 * ─────────────────────────────────────────────────────────────── */
const RECYCLE_KEY = 'toc:last-recycle';
async function autoRecycleFollowUps(){
  const today = new Date().toISOString().slice(0,10);
  if (localStorage.getItem(RECYCLE_KEY) === today) return null;

  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-14);
  const cutoffIso = cutoff.toISOString();

  // Candidates: status='Follow Up' AND no follow_up_date in future
  const { data: candidates, error } = await sb.from('ghl_leads')
    .select('id,name,follow_up_date')
    .eq('status', 'Follow Up')
    .or(`follow_up_date.is.null,follow_up_date.lt.${today}`)
    .limit(1000);
  if (error || !candidates || !candidates.length) {
    localStorage.setItem(RECYCLE_KEY, today);
    return null;
  }

  // For each candidate, check if there's been any activity in last 14 days.
  // Batch: fetch activities for these lead_ids since cutoff.
  const ids = candidates.map(c => c.id);
  const { data: recent } = await sb.from('lead_activities')
    .select('lead_id')
    .in('lead_id', ids)
    .gte('created_at', cutoffIso);
  const hasRecent = new Set((recent||[]).map(r => r.lead_id));
  const toRecycle = candidates.filter(c => !hasRecent.has(c.id));
  if (!toRecycle.length) {
    localStorage.setItem(RECYCLE_KEY, today);
    return null;
  }

  // Bulk update to status='Novi'
  const recycleIds = toRecycle.map(c => c.id);
  const { error: upErr } = await sb.from('ghl_leads')
    .update({ status: 'Novi' })
    .in('id', recycleIds);
  if (!upErr) {
    recycleIds.forEach(id => logActivity(id, 'status', 'Follow Up', 'Novi'));
    recycleIds.forEach(id => {
      const cached = (cachedLeads||[]).find(l => l.id === id);
      if (cached) cached.status = 'Novi';
    });
  }
  localStorage.setItem(RECYCLE_KEY, today);
  return { recycled: toRecycle.length };
}

  if (!r || !r.recycled) return;
  let wrap = document.getElementById('stl-toast-wrap');
  if (!wrap) {

/* ─────────────────── LEAD SCORING ─────────────────────────────────
 * Heuristic 0–100 score, then bucketed into 🔥 hot / 🌤 warm / ❄️ cold.
 * Signals:
 *  + 35 if attended the webinar (prisustvovao-webinaru)
 *  + 25 if qualified-webinar tagged
 *  + 15 if status = Follow Up (engaged but pending)
 *  + 20 if has follow-up date in future
 *  + 15 if added within last 3 days (recency)
 *  +  5 if has Instagram (extra contactability)
 *  - 30 if untouched > 14 days
 *  - 50 if status = DQ
 * ─────────────────────────────────────────────────────────────── */
function leadScore(l){
  if (!l) return 0;
  if (l.status === 'Closed') return 100;
  if (l.status === 'DQ') return 0;
  let s = 20;
  const tags = l.tags || [];
  if (tags.includes('prisustvovao-webinaru')) s += 35;
  if (tags.includes('qualified-webinar') || tags.includes('qualified')) s += 25;
  if (l.status === 'Follow Up') s += 15;
  const todayStr = new Date().toISOString().slice(0,10);
  if (l.follow_up_date && l.follow_up_date >= todayStr) s += 20;
  if (l.date_added) {
    const days = (Date.now() - new Date(l.date_added).getTime()) / 86400000;
    if (days <= 3) s += 15;
    else if (days > 14 && !l.follow_up_date) s -= 30;
  }
  if (l.instagram) s += 5;
  return Math.max(0, Math.min(100, s));
}
function leadHeat(score){
  if (score >= 70) return { label: 'Hot',  cls: 'heat-hot',  icon: '🔥' };
  if (score >= 45) return { label: 'Warm', cls: 'heat-warm', icon: '🌤' };
  return                  { label: 'Cold', cls: 'heat-cold', icon: '❄️' };
}

/* ─────────────────── ACTIVITY LOG ─────────────────────────────────
 * Every status/assign/followup/deal/note change is persisted into the
 * `lead_activities` Supabase table so we have an audit trail per lead.
 * Renders as a timeline inside the lead detail panel.
 *
 * Requires this Supabase SQL run once:
 *   create table if not exists lead_activities (
 *     id uuid primary key default gen_random_uuid(),
 *     lead_id text not null,
 *     actor_email text,
 *     action_type text not null,
 *     old_value text,
 *     new_value text,
 *     created_at timestamptz not null default now()
 *   );
 *   create index if not exists lead_activities_lead_id_idx
 *     on lead_activities (lead_id, created_at desc);
 * ─────────────────────────────────────────────────────────────── */
async function logActivity(leadId, actionType, oldValue, newValue){
  if (!leadId || !actionType) return;
  // Skip no-ops
  const ov = oldValue==null ? null : String(oldValue);
  const nv = newValue==null ? null : String(newValue);
  if (ov === nv) return;
  try {
    await sb.from('lead_activities').insert({
      lead_id: leadId,
      actor_email: currentUserEmail,
      action_type: actionType,
      old_value: ov,
      new_value: nv,
    });
  } catch (e) { /* non-fatal */ }
}

async function loadLeadActivities(leadId, limit = 25){
  const { data, error } = await sb.from('lead_activities')
    .select('*').eq('lead_id', leadId)
    .order('created_at', { ascending: false }).limit(limit);
  if (error) return [];
  return data || [];
}

function formatActivity(a){
  const map = {
    status:    { label: 'Status',    icon: '🔄' },
    assign:    { label: 'Dodeljen',  icon: '👤' },
    followup:  { label: 'Follow Up', icon: '📅' },
    deal:      { label: 'Paket',     icon: '💰' },
    note:      { label: 'Beleška',   icon: '📝' },
    created:   { label: 'Kreiran',   icon: '✨' },
  };
  const m = map[a.action_type] || { label: a.action_type, icon: '•' };
  const fmt = v => v==null||v==='' ? '∅' : v.length>40 ? v.slice(0,40)+'…' : v;
  let desc;
  if (a.action_type === 'note') {
    desc = a.new_value ? `napisao: "${fmt(a.new_value)}"` : 'obrisao belešku';
  } else if (a.old_value && a.new_value) {
    desc = `${fmt(a.old_value)} → ${fmt(a.new_value)}`;
  } else if (a.new_value) {
    desc = `postavljeno: ${fmt(a.new_value)}`;
  } else {
    desc = `uklonjeno: ${fmt(a.old_value)}`;
  }
  return { icon: m.icon, label: m.label, desc };
}

function timeAgoSr(iso){
  const t = new Date(iso).getTime();
  const diff = (Date.now() - t) / 1000;
  if (diff < 60) return 'sada';
  if (diff < 3600) return `pre ${Math.floor(diff/60)}min`;
  if (diff < 86400) return `pre ${Math.floor(diff/3600)}h`;
  if (diff < 86400*7) return `pre ${Math.floor(diff/86400)}d`;
  return new Date(iso).toLocaleDateString('sr-RS', { day:'numeric', month:'short', year:'2-digit' });
}

function cleanPhone(p){
  if (!p) return '';
  // Keep leading '+' but strip everything non-digit
  const s = String(p).trim();
  const lead = s.startsWith('+') ? '+' : '';
  return lead + s.replace(/[^\d]/g, '');
}
function waGreetingFor(lead){
  const firstName = (lead.name || '').split(' ')[0] || '';
  const repName   = lead.assigned_to === 'mateja' ? 'Mateja'

  const middle = attended ? `, vidim da si bio na predavanju u nedelju` : '';
  return `Ćao ${name}, ${intro}${middle}. Jel imaš sekund?`;
}
function waLink(lead){

}

/* ─────────────────── SPEED-TO-LEAD NOTIFICATIONS ──────────────────
 * Polls /api/ghl-recent every ~90s. The first poll establishes a
 * baseline of "already seen" lead IDs (no notifications fired).
 * After that, any new contact whose tags overlap a tracker-relevant
 * tag fires a desktop notification + in-app toast. Click → opens
 * the lead inside the Leads tab.
 * ─────────────────────────────────────────────────────────────── */
const STL_TRACKER_TAGS = new Set([
  'qualified','qualified-webinar',
  'dq','disqualified-webinar',
  'webinar-lead','prisustvovao-webinaru',
  'lead-magnet'
]);
const STL_POLL_MS    = 90000;
const STL_STORAGE_KEY = 'toc:seen-lead-ids';
let _stlTimer = null;
let _stlSeen  = null;            // Set<string> of lead IDs already known
let _stlInitialized = false;

function stlLoadSeenFromStorage(){
  try {
    const raw = localStorage.getItem(STL_STORAGE_KEY);
    if (!raw) return null;
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return null;
    return new Set(arr);
  } catch { return null; }
}
function stlSaveSeenToStorage(){
  try {
    // Cap at last 500 ids to avoid runaway storage
    const arr = [..._stlSeen].slice(-500);
    localStorage.setItem(STL_STORAGE_KEY, JSON.stringify(arr));
  } catch {}
}

async function stlRequestPermission(){
  if (!('Notification' in window)) return 'unsupported';
  if (Notification.permission === 'granted') return 'granted';
  if (Notification.permission === 'denied')  return 'denied';
  try { return await Notification.requestPermission(); } catch { return 'denied'; }
}

function stlIsTrackerContact(c){
  return (c.tags || []).some(t => STL_TRACKER_TAGS.has(t));
}

function stlShowToast(contact){
  let wrap = document.getElementById('stl-toast-wrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.id = 'stl-toast-wrap';
    wrap.className = 'stl-toast-wrap';
    document.body.appendChild(wrap);
  }
  const toast = document.createElement('div');
  toast.className = 'stl-toast';
  const meta = [contact.phone, contact.email].filter(Boolean).join(' · ');
  toast.innerHTML = `
    <div class="stl-toast-icon">⚡</div>
    <div class="stl-toast-body">
      <div class="stl-toast-title">Novi lead</div>
      <div class="stl-toast-name">${esc(contact.name||'Nepoznat')}</div>
      ${meta?`<div class="stl-toast-meta">${esc(meta)}</div>`:''}
    </div>
    <div class="stl-toast-close" title="Zatvori">×</div>
  `;
  const dismiss = () => {
    toast.classList.add('leaving');
    setTimeout(()=>toast.remove(), 250);
  };
  toast.querySelector('.stl-toast-close').addEventListener('click', e => { e.stopPropagation(); dismiss(); });
  toast.addEventListener('click', () => {
    dismiss();
    // Best-effort: switch to Leads tab; lead may not yet be in cache
    if (typeof setTab === 'function') setTab('leads');
    setTimeout(() => {
      if (typeof openLeadDetail === 'function' && (cachedLeads||[]).find(l=>l.id===contact.id)) {
        openLeadDetail(contact.id);
      }
    }, 600);
  });
  wrap.appendChild(toast);
  setTimeout(dismiss, 12000);
}

function stlShowDesktopNotification(contact){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const meta = [contact.phone, contact.email].filter(Boolean).join(' · ');
    const n = new Notification('⚡ Novi lead', {
      body: `${contact.name||'Nepoznat'}${meta?'\n'+meta:''}`,
      icon: '/thenewioslogov2.png',
      tag: 'toc-new-lead-'+contact.id,
    });
    n.onclick = () => {
      window.focus();
      if (typeof setTab === 'function') setTab('leads');
      n.close();
    };
  } catch (e) { console.warn('Notification failed:', e); }
}

async function stlPoll(){
  try {
    const r = await fetch('/api/ghl-recent', { cache: 'no-store' });
    if (!r.ok) return;
    const json = await r.json();
    const contacts = (json.contacts || []).filter(stlIsTrackerContact);
    if (!_stlSeen) _stlSeen = new Set();

    if (!_stlInitialized) {
      // First poll → baseline: record IDs but don't notify.
      // If localStorage already had a set, this just merges.
      contacts.forEach(c => _stlSeen.add(c.id));
      stlSaveSeenToStorage();
      _stlInitialized = true;
      return;
    }

    const fresh = contacts.filter(c => !_stlSeen.has(c.id));
    fresh.forEach(c => {
      _stlSeen.add(c.id);
      stlShowToast(c);
      stlShowDesktopNotification(c);
    });
    if (fresh.length) stlSaveSeenToStorage();
  } catch (e) {
    // Quiet — network blips shouldn't spam logs
  }
}

/* ─────────────────── LIVE CLOSE CELEBRATION ───────────────────────
 * Subscribes to Supabase Realtime INSERTs on lead_activities where
 * action_type='status' AND new_value='Closed'. Renders a celebration
 * banner with the lead name + which rep closed it. Visible for ~10s,
 * dismissable, and works across all open browser tabs.
 *
 * Requires Realtime enabled for lead_activities in the Supabase
 * dashboard (Database → Replication → toggle on). Falls back silently
 * if Realtime is disabled.
 * ─────────────────────────────────────────────────────────────── */
let _closeChannel = null;
function startCloseCelebrations(){
  if (_closeChannel || !sb || !sb.channel) return;
  try {
    _closeChannel = sb.channel('toc-closes')
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'lead_activities',
        filter: 'action_type=eq.status'
      }, async (payload) => {
        const row = payload?.new;
        if (!row || row.new_value !== 'Closed') return;
        // Look up lead name + rep
        let leadName = 'Lead', rep = '';
        try {
          const { data } = await sb.from('ghl_leads')
            .select('name,assigned_to').eq('id', row.lead_id).single();
          if (data) {
            leadName = data.name || 'Lead';
            rep = data.assigned_to || (row.actor_email||'').split('@')[0] || '';
          }
        } catch {}
        showCloseCelebration(leadName, rep);
      })
      .subscribe();
  } catch (e) { /* realtime not available */ }
}

function showCloseCelebration(leadName, rep){
  const wrap = document.body;
  const repCap = rep ? rep.charAt(0).toUpperCase() + rep.slice(1) : '';
  const banner = document.createElement('div');
  banner.className = 'close-celebrate';
  banner.innerHTML = `
    <div class="cc-emoji">🎉</div>
    <div class="cc-text">
      <div class="cc-title">CLOSED!</div>
      <div class="cc-sub">${repCap?esc(repCap)+' zatvorio ':''}<strong>${esc(leadName)}</strong></div>
    </div>
    <div class="cc-close">×</div>
  `;
  wrap.appendChild(banner);
  // Confetti dots
  for (let i = 0; i < 14; i++) {
    const dot = document.createElement('span');
    dot.className = 'cc-confetti';
    dot.style.left  = Math.random()*100 + '%';
    dot.style.background = ['#f43f5e','#22c55e','#3b82f6','#a855f7','#eab308','#f97316'][i%6];
    dot.style.animationDelay = (Math.random()*.4) + 's';
    dot.style.animationDuration = (1.2 + Math.random()*1.5) + 's';
    banner.appendChild(dot);
  }
  const dismiss = () => { banner.classList.add('leaving'); setTimeout(() => banner.remove(), 350); };
  banner.querySelector('.cc-close').onclick = dismiss;
  setTimeout(dismiss, 10000);
}

/* ─────────────────── KEYBOARD SHORTCUTS ───────────────────────────
 * '/'         → focus the Leads search input (Gmail-style).
 * ArrowLeft/ArrowRight (when detail panel open) → prev/next lead.
 * Esc         → close detail panel (handled elsewhere).
 * ─────────────────────────────────────────────────────────────── */
let _kbShortcutsInstalled = false;
function installKeyboardShortcuts(){
  if (_kbShortcutsInstalled) return;
  _kbShortcutsInstalled = true;
  document.addEventListener('keydown', (e) => {
    const tag = (e.target?.tagName || '').toLowerCase();
    const inField = ['input','textarea','select'].includes(tag) || e.target?.isContentEditable;
    // '/' to focus search
    if (e.key === '/' && !inField && !e.metaKey && !e.ctrlKey) {
      const search = document.querySelector('.leads-search');
      if (search) { e.preventDefault(); search.focus(); search.select?.(); }
      return;
    }
    // Arrow nav when detail panel is open
    if (currentLeadId && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !inField) {
      const { leads } = computeLeads();
      const idx = leads.findIndex(l => l.id === currentLeadId);
      if (idx === -1) return;
      const next = e.key === 'ArrowRight'
        ? (idx + 1 < leads.length ? leads[idx+1] : null)
        : (idx > 0 ? leads[idx-1] : null);
      if (next) { e.preventDefault(); openLeadDetail(next.id); }
    }
  });
}

/* ─────────────────── DUPLICATE DETECTOR ───────────────────────────
 * Scans cachedLeads for leads sharing the same phone or email.
 * Returns groups of 2+ leads with the matching identifier.
 * ─────────────────────────────────────────────────────────────── */
function findLeadDuplicates(){
  const byPhone = new Map(), byEmail = new Map();
  (cachedLeads||[]).forEach(l => {
    if (l.phone) {
      const p = String(l.phone).replace(/[^\d]/g,'');
      if (p.length >= 7) {
        if (!byPhone.has(p)) byPhone.set(p, []);
        byPhone.get(p).push(l);
      }
    }
    if (l.email) {
      const e = String(l.email).trim().toLowerCase();
      if (e) {
        if (!byEmail.has(e)) byEmail.set(e, []);
        byEmail.get(e).push(l);
      }
    }
  });
  const groups = [];
  byPhone.forEach((v,k) => { if (v.length > 1) groups.push({ type:'phone', key:k, leads:v }); });
  byEmail.forEach((v,k) => { if (v.length > 1) groups.push({ type:'email', key:k, leads:v }); });
  return groups;
}

/* ─────────────────── SNOOZE ──────────────────────────────────────
 * Stores per-lead "hide until" date in localStorage. Snoozed leads
 * are hidden from the default leads view unless explicitly toggled.
 *
 * Requires this Supabase SQL (optional — falls back to localStorage):
 *   alter table ghl_leads add column if not exists snoozed_until date;
 * ─────────────────────────────────────────────────────────────── */
const SNOOZE_KEY = 'toc:snoozed';
let leadsShowSnoozed = false;
function loadSnoozeMap(){
  try { return JSON.parse(localStorage.getItem(SNOOZE_KEY) || '{}'); }
  catch { return {}; }
}
function saveSnoozeMap(m){ localStorage.setItem(SNOOZE_KEY, JSON.stringify(m)); }
function isSnoozed(leadId){
  const today = new Date().toISOString().slice(0,10);
  const m = loadSnoozeMap();
  return m[leadId] && m[leadId] > today;
}
async function snoozeLead(leadId, untilDate){
  const m = loadSnoozeMap();
  if (untilDate) m[leadId] = untilDate; else delete m[leadId];
  saveSnoozeMap(m);
  // Try to persist to Supabase too (no-op if column missing)
  try { await sb.from('ghl_leads').update({ snoozed_until: untilDate || null }).eq('id', leadId); }
  catch {}
  logActivity(leadId, 'snooze', null, untilDate || null);
  refreshLeadRows();
  if (currentLeadId === leadId) openLeadDetail(leadId);
}
function toggleShowSnoozed(){
  leadsShowSnoozed = !leadsShowSnoozed;
  renderLeads(cachedLeads);
}

function toggleSmartView(){
  leadsSmartView = !leadsSmartView;
  if (leadsSmartView) { leadsShowFollowUp = false; leadsShowStale = false; }
  renderLeads(cachedLeads);
}

function stlStart(){
  if (_stlTimer) return;
  _stlSeen = stlLoadSeenFromStorage() || new Set();
  _stlInitialized = _stlSeen.size > 0;  // if we have history, treat next fresh-only
  stlRequestPermission();  // fire-and-forget
  stlPoll();               // immediate first poll
  _stlTimer = setInterval(stlPoll, STL_POLL_MS);
  // Re-poll when tab becomes visible again
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') stlPoll();
  });
}

async function loadLeadCounts(){
  const [allR,qR,dqR,wR,waR,lR]=await Promise.all([
    sb.from('ghl_leads').select('id',{count:'exact',head:true}),
    sb.from('ghl_leads').select('id',{count:'exact',head:true}).overlaps('tags',['qualified','qualified-webinar']),
    sb.from('ghl_leads').select('id',{count:'exact',head:true}).overlaps('tags',['dq','disqualified-webinar']),
    sb.from('ghl_leads').select('id',{count:'exact',head:true}).overlaps('tags',['webinar-lead']),
    sb.from('ghl_leads').select('id',{count:'exact',head:true}).overlaps('tags',['prisustvovao-webinaru']),
    sb.from('ghl_leads').select('id',{count:'exact',head:true}).overlaps('tags',['lead-magnet']),
  ]);
  return{all:allR.count||0,qualified:qR.count||0,disqualified:dqR.count||0,webinar_lead:wR.count||0,webinar_attended:waR.count||0,lead_magnet:lR.count||0};
}

function mapContact(c, lead_type){
  const cf={};
  (c.customFields||[]).forEach(f=>{if(GHL_CF[f.id])cf[GHL_CF[f.id]]=f.value;});
  return{
    id:c.id, lead_type,
    tags:c.tags||[],
    name:[c.firstName,c.lastName].filter(Boolean).join(' ')||'Nepoznat',
    email:c.email||null, phone:c.phone||null,
    instagram:cf.instagram||null, experience:cf.experience||null,
    pain_point:cf.pain_point||null, knowledge:cf.knowledge||null,
    time_frame:cf.time_frame||null, qualification:cf.qualification||null,
    date_added:c.dateAdded||new Date().toISOString(),
    synced_at:new Date().toISOString(),
    utm_source:(c.attributions||[]).find(a=>a.isFirst)?.utmSource||(c.attributions||[])[0]?.utmSource||null,
    utm_medium:(c.attributions||[]).find(a=>a.isFirst)?.utmMedium||(c.attributions||[])[0]?.utmMedium||null,
    utm_campaign:(c.attributions||[]).find(a=>a.isFirst)?.utmCampaign||(c.attributions||[])[0]?.utmCampaign||null,
    utm_content:(c.attributions||[]).find(a=>a.isFirst)?.utmContent||(c.attributions||[])[0]?.utmContent||null,
  };
}

async function syncLeadsFromGHL(){
  const btn=document.querySelector('.sync-btn');
  if(btn)btn.classList.add('spinning');
  try{
    const res=await fetch('/api/ghl-leads');
    if(!res.ok)throw new Error(`API HTTP ${res.status}`);
    const json=await res.json();
    if(json.error)throw new Error(json.error);
    // Merge all contacts by ID — tags stored from GHL, lead_type = highest priority match
    const seen=new Map();
    const priority=['qualified','disqualified','webinar_attended','webinar_lead','lead_magnet'];
    [
      ...(json.qualified||[]).map(c=>mapContact(c,'qualified')),
      ...(json.disqualified||[]).map(c=>mapContact(c,'disqualified')),
      ...(json.webinarAttended||[]).map(c=>mapContact(c,'webinar_attended')),
      ...(json.webinarLead||[]).map(c=>mapContact(c,'webinar_lead')),
      ...(json.leadMagnet||[]).map(c=>mapContact(c,'lead_magnet')),
    ].forEach(r=>{
      const existing=seen.get(r.id);
      if(!existing||priority.indexOf(r.lead_type)<priority.indexOf(existing.lead_type)) seen.set(r.id,r);
    });
    const rows=[...seen.values()];
    if(rows.length){
      // Upsert in chunks to avoid request-size limits
      const CHUNK=500;
      for(let i=0;i<rows.length;i+=CHUNK){
        const {error}=await sb.from('ghl_leads').upsert(rows.slice(i,i+CHUNK),{onConflict:'id',ignoreDuplicates:false});
        if(error){console.error('Upsert error:',error);break;}
      }
    }
    // Full reconciliation: delete any Supabase rows no longer in GHL.
    // (Contacts removed from GHL or no longer matching tracker tags.)
    const currentIds=new Set(rows.map(r=>r.id));
    const {data:existing,error:fetchErr}=await sb.from('ghl_leads').select('id').limit(20000);
    if(!fetchErr && existing){
      const stale=existing.filter(r=>!currentIds.has(r.id)).map(r=>r.id);
      const CHUNK=200;
      for(let i=0;i<stale.length;i+=CHUNK){
        const {error}=await sb.from('ghl_leads').delete().in('id',stale.slice(i,i+CHUNK));
        if(error){console.error('Delete error:',error);break;}
      }
      if(stale.length) console.log(`Sync removed ${stale.length} stale leads not in GHL anymore.`);
    }
    await renderLeadsSection();
    // After GHL sync: auto-distribute unassigned leads round-robin
    autoAssignUnassigned().then(r => showRoundRobinToast(r));
    // Reconcile sheet → CRM Closed status
    syncClosedFromSheet({force:true}).then(r => showSheetSyncToast(r));
    // Auto-recycle stale Follow-Up leads back to Novi
    autoRecycleFollowUps().then(r => showRecycleToast(r));
  }catch(e){

async function loadCampaignData(){
  const {data,error}=await sb.from('ghl_leads')
    .select('utm_campaign,utm_content,utm_source,utm_medium,status,deal,lead_type,tags')
    .overlaps('tags',['webinar-lead','qualified-webinar','disqualified-webinar'])
    .limit(5000);
  if(error||!data) return [];
  const isId=v=>v&&/^\d{10,}$/.test(v.trim());
  const fmt=v=>!v||isId(v)?null:v;
  const fmtCampaign=v=>!v||isId(v)?'Nepoznata kampanja':v.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  const map={};
  data.forEach(r=>{
    const content=fmt(r.utm_content);
    const hasUtm=!!(r.utm_campaign||r.utm_content||r.utm_source);
    const key=hasUtm?(content||'').toLowerCase()||'no-content':'organic';
    if(!map[key]) map[key]={
      key,
      content:hasUtm?(content||'Nepoznat oglas'):'Organic / Direct',
      campaign:hasUtm?fmtCampaign(r.utm_campaign):'',
      source:(r.utm_source||'').toLowerCase().replace(/^ig$/,'instagram'),
      leads:0, closes:0, revenue: 0
    };
    map[key].leads++;
    if(r.status==='Closed') {
      map[key].closes++;
      const price = r.deal && DEAL_PRICES[r.deal];
      if (price) map[key].revenue += price;
    }
  });
  return Object.values(map).sort((a,b)=>b.leads-a.leads);
}

// Ad spend persisted in localStorage by campaign key.
const AD_SPEND_KEY = 'toc:ad-spend';
function loadAdSpend(){
  try { return JSON.parse(localStorage.getItem(AD_SPEND_KEY) || '{}'); }
  catch { return {}; }
}
function saveAdSpend(key, amount){
  const all = loadAdSpend();
  const n = Number(amount);
  if (!n || n <= 0) delete all[key]; else all[key] = n;
  localStorage.setItem(AD_SPEND_KEY, JSON.stringify(all));
}
function updateAdSpendCell(key, amount){
  saveAdSpend(key, amount);
  // Re-render to refresh CPL/CPC/ROAS columns
  renderAdsView();
}

function exportLeadsCSV(){
  const {leads} = computeLeads();
  if (!leads.length) { alert('Nema leadova za eksport.'); return; }
  const cols = ['name','email','phone','instagram','status','lead_type','assigned_to','follow_up_date','date_added','tags','deal','notes'];
  const head = cols.join(',');
  const escCsv = v => {
    if (v == null) return '';
    const s = Array.isArray(v) ? v.join(';') : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const body = leads.map(l => cols.map(c => escCsv(l[c])).join(',')).join('\n');
  const csv = head + '\n' + body;
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const stamp = new Date().toISOString().slice(0,10);
  a.download = `leads_${leadsSubTab}_${stamp}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function pipelineValue(leads){
  let openValue = 0, closedValue = 0;
  (leads||[]).forEach(l => {
    if (!l.deal || !DEAL_PRICES[l.deal]) return;
    const price = DEAL_PRICES[l.deal];
    if (l.status === 'Closed') closedValue += price;
    else if (l.status !== 'DQ') openValue += price;
  });
  return { open: openValue, closed: closedValue };
}

// Computes the searched + assign-filtered lead list and the filter counts.
function computeLeads(){
  const q=leadsSearch.trim().toLowerCase();
  const all=cachedLeads||[];
  let searched=q ? all.filter(l=>[l.name,l.email,l.phone,l.instagram].some(v=>v&&v.toLowerCase().includes(q))) : all;
  if(leadsShowFollowUp){
    const todayStr=new Date().toISOString().slice(0,10);
    searched=searched.filter(l=>l.follow_up_date===todayStr&&l.status!=='Closed'&&l.status!=='DQ');
  }
  if(leadsTagFilter){
    searched=searched.filter(l=>Array.isArray(l.tags)&&l.tags.includes(leadsTagFilter));
  }
  if(!leadsShowSnoozed){
    searched=searched.filter(l=>!isSnoozed(l.id));
  }
  if(leadsShowStale){
    // Stale = open AND created >14d ago AND no upcoming follow-up
    const fourteenDaysAgo=new Date(); fourteenDaysAgo.setDate(fourteenDaysAgo.getDate()-14);
    const cutoffIso=fourteenDaysAgo.toISOString();
    const cutoffDay=fourteenDaysAgo.toISOString().slice(0,10);
    searched=searched.filter(l=>{
      if (l.status==='Closed'||l.status==='DQ') return false;
      if (l.date_added && l.date_added >= cutoffIso) return false;
      // If they have a future or recent follow-up, not stale
      if (l.follow_up_date && l.follow_up_date >= cutoffDay) return false;
      return true;
    });
  }
  let leads=searched;
  if(leadsFilter==='mateja')        leads=searched.filter(l=>l.assigned_to==='mateja');
  else if(leadsFilter==='dusica')   leads=searched.filter(l=>l.assigned_to==='dusica');
  else if(leadsFilter==='unassigned') leads=searched.filter(l=>!l.assigned_to);
  if(leadsSmartView){
    // Hide cold leads (score < 45) and sort hottest-first.
    leads = leads
      .map(l => ({ l, s: leadScore(l) }))
      .filter(x => x.s >= 45 && x.l.status !== 'Closed' && x.l.status !== 'DQ')
      .sort((a, b) => b.s - a.s)
      .map(x => x.l);
  }
  const fc={
    all:searched.length,
    mateja:searched.filter(l=>l.assigned_to==='mateja').length,
    dusica:searched.filter(l=>l.assigned_to==='dusica').length,
    unassigned:searched.filter(l=>!l.assigned_to).length,
  };
  return {searched,leads,fc};
}
